name: Build Android APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets into Android project
        run: npm run android:sync

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk calisthenie-maison-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calisthenie-maison-debug-apk
          path: calisthenie-maison-debug.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Dernier APK (build automatique)"
          body: |
            APK de débogage généré automatiquement depuis le commit ${{ github.sha }}.
            Installe-le en autorisant les "sources inconnues" sur Android.
          make_latest: true
          files: calisthenie-maison-debug.apk
