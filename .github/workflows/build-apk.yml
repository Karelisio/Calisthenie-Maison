name: Build Android APK

on:
  push:
    branches: [main, "claude/**", material-design]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release variables
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "material-design" ]; then
            echo "tag=apk-material-latest" >> "$GITHUB_OUTPUT"
            echo "apk_name=calisthenie-maison-material-debug.apk" >> "$GITHUB_OUTPUT"
            echo "artifact_name=calisthenie-maison-material-debug-apk" >> "$GITHUB_OUTPUT"
            echo "release_title=Dernier APK Material (build automatique)" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=apk-latest" >> "$GITHUB_OUTPUT"
            echo "apk_name=calisthenie-maison-debug.apk" >> "$GITHUB_OUTPUT"
            echo "artifact_name=calisthenie-maison-debug-apk" >> "$GITHUB_OUTPUT"
            echo "release_title=Dernier APK (build automatique)" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets into Android project
        run: npm run android:sync

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "${{ steps.vars.outputs.apk_name }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.artifact_name }}
          path: ${{ steps.vars.outputs.apk_name }}

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.release_title }}
          body: |
            APK de débogage généré automatiquement depuis le commit ${{ github.sha }} (branche ${{ github.ref_name }}).
            Installe-le en autorisant les "sources inconnues" sur Android.
          make_latest: ${{ steps.vars.outputs.make_latest }}
          files: ${{ steps.vars.outputs.apk_name }}
