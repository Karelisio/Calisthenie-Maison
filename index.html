      <div style="display:flex;flex-direction:column;gap:10px;">
        <button class="btn ${settings.warmupMode!=='long'?'primary':'ghost'} block" data-set-warmup-mode="short">🌤️ Court (~3 min)</button>
        <button class="btn ${settings.warmupMode==='long'?'primary':'ghost'} block" data-set-warmup-mode="long">🔥 Long (~7 min)</button>
      </div>
      <button class="btn ghost block" style="margin-top:14px;" data-action="closeSheet">Fermer</button>
    </div></div>`;
  }
  if(sheet.type==='changelog'){
    const since = sheet.since;
    // Sans repère (mise à jour depuis une version antérieure à ce journal), on
    // se contente de signaler la version qui vient d'être installée.
    const isNew = v => since ? (parseInt(v,10) > parseInt(since,10)) : (v === APP_BUILD);
    const intro = sheet.auto
      ? `<p style="margin-bottom:16px;">L'application vient d'être mise à jour. Voici ce qui a changé.</p>`
      : `<p style="margin-bottom:16px;">Tu es en version ${escapeHtml(APP_BUILD)}.</p>`;
    return `<div class="overlay" data-close-sheet="1"><div class="sheet" onclick="event.stopPropagation()">
      <h3>✨ Quoi de neuf</h3>
      ${intro}
      ${CHANGELOG.map(rel=>`
        <div class="release-entry">
          <div class="row wrap" style="gap:8px;align-items:baseline;">
            <span class="pill">version ${escapeHtml(rel.v)}</span>
            ${isNew(rel.v) ? `<span class="badge">Nouveau</span>` : ''}
          </div>
          <b style="display:block;font-size:15px;font-weight:600;margin:8px 0 2px;">${escapeHtml(rel.title)}</b>
          <ul class="tips-list" style="gap:8px;margin-top:8px;">
            ${rel.items.map(it=>`<li>${escapeHtml(it)}</li>`).join('')}
          </ul>
        </div>`).join('')}
      <button class="btn primary block" style="margin-top:18px;" data-action="closeSheet">C'est noté</button>
    </div></div>`;
  }
  if(sheet.type==='soundProfile'){
    return `<div class="overlay" data-close-sheet="1"><div class="sheet" onclick="event.stopPropagation()">
      <h3>🔔 Sonorité des bips</h3>
      <p style="margin-bottom:14px;">Choisis une sonorité distincte pour ne pas confondre ton minuteur avec celui d'un voisin. Appuie sur un choix pour l'entendre.</p>
      <div style="display:flex;flex-direction:column;gap:10px;">
        ${Object.keys(SOUND_PROFILES).map(k=>
          `<button class="btn ${settings.soundProfile===k?'primary':'ghost'} block" data-set-sound-profile="${k}">${SOUND_PROFILES[k].label}</button>`
        ).join('')}
      </div>
      <button class="btn ghost block" style="margin-top:14px;" data-action="closeSheet">Fermer</button>
    </div></div>`;
  }
  if(sheet.type==='update'){
    let body = '';
    if(updateState.status==='idle'){
      body = `<p>Vérifie si une nouvelle version de l'application est disponible.</p>
        <button class="btn primary block" style="margin-top:12px;" data-action="checkUpdate">🔍 Vérifier les mises à jour</button>`;
    } else if(updateState.status==='checking'){
      body = `<p>Recherche d'une mise à jour…</p>`;
    } else if(updateState.status==='upToDate'){
      body = `<p>✅ Tu as déjà la dernière version.</p>
        <button class="btn ghost block" style="margin-top:12px;" data-action="checkUpdate">🔍 Revérifier</button>`;
    } else if(updateState.status==='available'){
      body = `<p>🎉 Une nouvelle version est disponible.</p>
        <button class="btn primary block" style="margin-top:12px;" data-action="installUpdate">⬇️ Télécharger et installer</button>`;
    } else if(updateState.status==='downloading'){
      const pct = (typeof updateState.percent === 'number') ? updateState.percent : null;
      const label = updateState.stateLabel || '';
      body = `<p>Téléchargement de la mise à jour${pct!==null ? ' — ' + pct + ' %' : '…'}</p>
        ${label ? `<p style="margin-top:4px;">${escapeHtml(label)}</p>` : ''}
        <div class="progress-outer" style="margin-top:12px;"><div class="progress-inner" style="width:${pct!==null?pct:0}%"></div></div>
        <button class="btn ghost block" style="margin-top:12px;" data-action="cancelUpdate">Annuler le téléchargement</button>`;
    } else if(updateState.status==='installing'){
      body = `<p>✅ Téléchargement terminé. L'écran d'installation Android devrait s'afficher dans un instant.</p>
        <p style="margin-top:8px;">S'il ne s'affiche pas, ferme cette fenêtre et réessaie, ou installe le fichier à la main (appui long sur le bouton "Mise à jour").</p>
        <button class="btn ghost block" style="margin-top:12px;" data-action="checkUpdate">🔍 Réessayer</button>`;
    } else if(updateState.status==='error'){
      body = `<p>⚠️ ${escapeHtml(updateState.error||'Une erreur est survenue.')}</p>
        <button class="btn ghost block" style="margin-top:12px;" data-action="checkUpdate">🔍 Réessayer</button>`;
    }
    return `<div class="overlay" data-close-sheet="1"><div class="sheet" onclick="event.stopPropagation()">
      <h3>🔄 Mise à jour</h3>
      ${body}
      <button class="btn ghost block" style="margin-top:18px;" data-action="closeSheet">Fermer</button>
    </div></div>`;
  }
  return '';
}

/* ---------------- PLAYER ---------------- */
function flattenSteps(session){
  // build list of {exoIndex, setIndex, exo}
  const steps = [];
  session.exos.forEach((e,ei)=>{
    for(let s=0;s<e.sets;s++) steps.push({exoIndex:ei, setIndex:s, exo:e});
  });
  return steps;
}

/* Vrai si cet exercice de séance (référencé par libId) est une fente
   désactivée via "Éviter les fentes". */
function isBlockedExo(e){
  const src = e.libId ? getExoById(e.libId) : null;
  return isLungeBlocked(src||{});
}
function startSession(idx){
  if(!sessions[idx].exos.length){ toast('Cette séance est vide.'); return; }
  const session = JSON.parse(JSON.stringify(sessions[idx]));
  if(settings.avoidLunges){
    session.exos = session.exos.filter(e=>!isBlockedExo(e));
    if(!session.exos.length){ toast('Cette séance ne contient que des fentes, désactivées dans "Éviter les fentes".'); return; }
  }
  if(settings.warmup){
    // On se base sur les exercices réellement retenus (fentes déjà écartées
    // le cas échéant), pour que l'échauffement corresponde à ce qui sera fait.
    const mainExos = {exos: session.exos.slice()};
    session.exos = [
      ...buildWarmupExos(mainExos),
      ...session.exos,
      ...buildStretchExos(mainExos),
    ];
  }
  const steps = flattenSteps(session);
  player = {
    session, steps, stepIdx:0,
    phase:'work', // work | rest | done
    remaining: steps[0].exo.type==='time' ? steps[0].exo.val : null,
    running:false,
    endAt:null,
    intervalId:null,
    restDuration:null,
    beepedAt:{},
    sideBreak:null, // {remaining, endAt, resumeRemaining} pendant la pause "changez de côté"
    sideSwitchDone:false
  };
  view = 'player';
  setKeepAwake(true);
  render();
}

function currentStep(){ return player.steps[player.stepIdx]; }

function clearTick(){
  if(player.intervalId){ clearInterval(player.intervalId); player.intervalId=null; }
}

function startCountdown(seconds){
  player.remaining = seconds;
  player.running = true;
  player.endAt = Date.now() + seconds*1000;
  player.beepedAt = {};
  player.sideBreak = null;
  player.sideSwitchDone = false;
  clearTick();
  player.intervalId = setInterval(tick, 200);
  render();
}

/* Bascule à mi-mouvement vers une petite pause "changez de côté" pour les
   exercices marqués `sides`, plutôt qu'un simple bip à suivre à l'œil. */
function triggerSideBreak(remainingAtHalf){
  player.sideSwitchDone = true;
  beep(700,150,0.15); vibrate([50,40,50]);
  player.sideBreak = { remaining: SIDE_SWITCH_SEC, endAt: Date.now()+SIDE_SWITCH_SEC*1000, resumeRemaining: remainingAtHalf };
  render();
}
function skipSideBreak(){
  if(!player.sideBreak) return;
  const resumeRemaining = player.sideBreak.resumeRemaining;
  player.sideBreak = null;
  player.remaining = resumeRemaining;
  if(player.running){ player.endAt = Date.now() + resumeRemaining*1000; }
  render();
}

function tick(){
  if(!player || !player.running) return;
  if(player.sideBreak){
    const remainingMs = player.sideBreak.endAt - Date.now();
    const remaining = Math.max(0, Math.ceil(remainingMs/1000));
    if(remaining !== player.sideBreak.remaining){
      player.sideBreak.remaining = remaining;
      if(remaining<=2 && remaining>0) beep(700,90,0.1);
      updatePlayerDom();
    }
    if(remainingMs<=0){
      const resumeRemaining = player.sideBreak.resumeRemaining;
      player.sideBreak = null;
      beep(1000,150,0.15); vibrate(80);
      player.remaining = resumeRemaining;
      player.endAt = Date.now() + resumeRemaining*1000;
      render();
    }
    return;
  }
  const remainingMs = player.endAt - Date.now();
  const remaining = Math.max(0, Math.ceil(remainingMs/1000));
  if(remaining !== player.remaining){
    player.remaining = remaining;
    const st = currentStep();
    if(player.phase==='work' && st.exo.type==='time' && st.exo.sides && !player.sideSwitchDone
       && remaining>0 && remaining<=Math.floor(st.exo.val/2)){
      triggerSideBreak(remaining);
      return;
    }
    if(remaining<=3 && remaining>0 && !player.beepedAt[remaining]){
      player.beepedAt[remaining]=true; beep(880,120,0.12);
    }
    updatePlayerDom();
  }
  if(remainingMs<=0){
    clearTick();
    player.running=false;
    beep(1200,260,0.18);
    vibrate([120,60,120]);
    advanceAfterCountdown();
  }
}

function pausePlayer(){
  if(!player.running) return;
  player.running=false;
  if(player.sideBreak){
    player.sideBreak.remaining = Math.max(0, Math.ceil((player.sideBreak.endAt-Date.now())/1000));
  } else {
    player.remaining = Math.max(0, Math.ceil((player.endAt-Date.now())/1000));
  }
  clearTick();
  render();
}
function resumePlayer(){
  if(player.running) return;
  if(player.sideBreak){
    player.sideBreak.endAt = Date.now() + player.sideBreak.remaining*1000;
  } else {
    if(player.remaining==null) return;
    player.endAt = Date.now() + player.remaining*1000;
  }
  player.running=true;
  clearTick();
  player.intervalId = setInterval(tick,200);
  render();
}
function resetPlayerPhase(){
  clearTick();
  const st = currentStep();
  if(player.phase==='work' && st.exo.type==='time'){
    startCountdown(st.exo.val);
  } else if(player.phase==='rest'){
    startCountdown(player.restDuration);
  }
}

function adjustRest(delta){
  if(player.phase!=='rest') return;
  const remainingMs = player.running ? (player.endAt-Date.now()) : player.remaining*1000;
  const newRemaining = Math.max(5, Math.round(remainingMs/1000)+delta);
  player.remaining = newRemaining;
  if(player.running){ player.endAt = Date.now()+newRemaining*1000; }
  render();
}

function completeRepsSet(){
  clearTick();
  beep(1200,220,0.18);
  vibrate(80);
  goToRestOrNext();
}

function skipCurrent(){
  clearTick();
  if(player.phase==='work'){ goToRestOrNext(); }
  else { goToNextStep(); }
}

function advanceAfterCountdown(){
  if(player.phase==='work'){ goToRestOrNext(); }
  else if(player.phase==='rest'){ goToNextStep(); }
}

function goToRestOrNext(){
  const isLastStep = player.stepIdx === player.steps.length-1;
  if(isLastStep){
    finishSession();
    return;
  }
  const st = currentStep();
  const restLen = st.exo.rest;
  player.phase = 'rest';
  player.restDuration = restLen;
  startCountdown(restLen);
}

function goToNextStep(){
  player.stepIdx++;
  if(player.stepIdx >= player.steps.length){ finishSession(); return; }
  player.phase='work';
  startWorkPhase();
}
/* Remet la phase de travail à zéro pour l'étape courante. */
function startWorkPhase(){
  const st = currentStep();
  if(st.exo.type==='time'){ startCountdown(st.exo.val); }
  else { player.remaining=null; player.running=false; clearTick(); render(); }
}
/* Revenir en arrière : depuis un repos on repart sur l'exercice qu'on vient de
   faire, sinon on remonte à l'étape précédente. */
function goToPrevStep(){
  clearTick();
  cancelResumeCountdown();
  if(player.phase === 'rest'){
    player.phase = 'work';
  } else if(player.stepIdx > 0){
    player.stepIdx--;
    player.phase = 'work';
  }
  startWorkPhase();
}

function finishSession(){
  clearTick();
  player.phase='review';
  player.feeling = null;
  player.note = '';
  // Une entrée par série, pré-remplie avec l'objectif : valider "comme prévu"
  // reste un seul appui, le détail ne s'ouvre que si on le demande.
  player.review = player.session.exos.map(e=>({
    completed:true,
    detailed:false,
    reps: Array.from({length: Math.max(1, e.sets||1)}, ()=>e.val)
  }));
  beep(660,150,0.15); setTimeout(()=>beep(880,150,0.15),160); setTimeout(()=>beep(1100,220,0.18),320);
  vibrate([100,50,100,50,150]);
  render();
}

function saveReview(){
  const s = player.session;
  const entry = {
    id: 'log_'+Date.now(),
    sessionName: s.name,
    dateISO: new Date().toISOString(),
    exercises: s.exos.map((e,i)=>({e,i})).filter(({e})=>!e.meta).map(({e,i})=>{
      const ans = player.review[i];
      const reps = (ans.reps||[]).map(r=>Math.max(0, parseInt(r)||0));
      // "reps" n'est enregistré que si l'utilisateur a détaillé : sinon la
      // séance a été faite comme prévu et l'objectif suffit à la décrire.
      return {
        name:e.name, icon:e.icon, type:e.type,
        plannedSets:e.sets, plannedVal:e.val,
        completed: !ans.detailed || reps.every(r=>r>=e.val),
        reps: ans.detailed ? reps : null
      };
    }),
    feeling: player.feeling || null,
    note: (player.note || '').trim()
  };
  logs.push(entry);
  saveLogs(logs);
  exitPlayer();
  toast('Séance enregistrée dans ton suivi ✓');
}

function exitPlayer(){
  clearTick();
  cancelResumeCountdown();
  setKeepAwake(false);
  player=null;
  view='home';
  render();
}

function renderReviewExo(e,i){
  const ans = player.review[i];
  const unit = e.type==='time' ? 's' : '';
  return `<div class="card tight" style="margin-bottom:10px;">
    <div class="row between wrap">
      <b>${e.icon} ${escapeHtml(e.name)}</b>
      <span class="pill">Objectif ${e.sets}×${e.val}${unit}</span>
    </div>
    <div class="row wrap" style="margin-top:10px;gap:8px;">
      <button class="btn sm ${!ans.detailed?'accent':'ghost'}" data-review-mode="${i}" data-val="done">✓ Comme prévu</button>
      <button class="btn sm ${ans.detailed?'accent':'ghost'}" data-review-mode="${i}" data-val="detail">✏️ Détailler</button>
    </div>
    ${ans.detailed ? `
    <div class="row wrap" style="margin-top:10px;gap:10px;">
      ${ans.reps.map((r,si)=>`
        <label class="field set-field" style="margin-bottom:0;">
          <span>Série ${si+1}${unit ? ' (s)' : ''}</span>
          <input type="number" min="0" inputmode="numeric" data-review-rep="${i}" data-set="${si}" value="${escapeHtml(String(r))}">
        </label>`).join('')}
    </div>
    <p style="margin-top:8px;font-size:12px;">Mets 0 sur une série que tu n'as pas faite.</p>` : ''}
  </div>`;
}

function renderPlayer(){
  const s = player.session;
  if(player.phase==='review'){
    return `<div class="player" style="text-align:left;padding-top:10px;">
      <div class="big-emoji" style="text-align:center;">🎉</div>
      <h1 style="text-align:center;">Séance terminée !</h1>
      <p style="text-align:center;margin-bottom:20px;">${escapeHtml(s.name)} — comment ça s'est passé ?</p>
      ${s.exos.map((e,i)=>e.meta ? '' : renderReviewExo(e,i)).join('')}
      <div class="card tight" style="margin-bottom:10px;">
        <b style="font-size:14px;">📝 Ton ressenti</b>
        <div class="row wrap" style="margin-top:10px;gap:8px;">
          ${Object.keys(FEELING_LABELS).map(k=>
            `<button class="btn sm ${player.feeling===k ? (k==='hard'?'danger':'accent') : 'ghost'}" data-feeling="${k}">${FEELING_LABELS[k]}</button>`
          ).join('')}
        </div>
        <label class="field" style="margin:12px 0 0;">
          <span>Note (optionnel)</span>
          <textarea id="reviewNote" rows="3" placeholder="Ex : bras fatigués sur les dernières séries, à refaire avec plus de repos…">${escapeHtml(player.note||'')}</textarea>
        </label>
      </div>
      <div class="row" style="margin-top:6px;gap:10px;">
        <button class="btn ghost block" data-action="skipReview">Ignorer</button>
        <button class="btn primary block" data-action="saveReview">💾 Enregistrer dans mon suivi</button>
      </div>
    </div>`;
  }
  const st = currentStep();
  const totalSteps = player.steps.length;
  const progressPct = Math.round((player.stepIdx/totalSteps)*100);
  const nextStep = player.steps[player.stepIdx+1];
  let nextLabel = '';
  if(player.phase==='rest'){
    if(nextStep){
      const isNewExo = nextStep.exoIndex !== st.exoIndex;
      nextLabel = isNewExo ? `Prochain : <b>${nextStep.exo.icon} ${escapeHtml(nextStep.exo.name)}</b>` : `Série suivante : <b>${nextStep.exo.icon} ${escapeHtml(nextStep.exo.name)}</b>`;
    } else {
      nextLabel = `Dernière ligne droite ✨`;
    }
  }

  let centerHtml = '';
  let controlsHtml = '';

  // Un pas en arrière n'a de sens que s'il reste quelque chose derrière :
  // depuis un repos on revient sur l'exercice, sinon sur l'étape précédente.
  const canGoBack = player.phase === 'rest' || player.stepIdx > 0;
  const prevBtn = canGoBack ? `<button class="btn ghost" data-action="prev" title="Exercice précédent">⏮ Précédent</button>` : '';

  if(player.resumeIn != null){
    centerHtml = `<div class="big-emoji">🧘</div><div class="timer glow-rest">${player.resumeIn}</div><div class="side-switch-label">Reprise dans un instant — remets-toi en place</div>`;
    controlsHtml = `
      <div class="controls">
        <button class="btn primary" data-action="resumeNow">▶ Reprendre maintenant</button>
      </div>`;
  } else if(player.phase==='work'){
    if(player.sideBreak){
      centerHtml = `<div class="big-emoji">🔁</div><div class="timer glow-rest">${formatTime(player.sideBreak.remaining)}</div><div class="side-switch-label">Changez de côté</div>`;
      controlsHtml = `
        <div class="controls">
          <button class="btn primary" data-action="skipSideBreak">⏭ Reprendre</button>
        </div>`;
    } else if(st.exo.type==='time'){
      centerHtml = `<div class="big-emoji">${st.exo.icon}</div><div class="timer glow-work">${formatTime(player.remaining)}</div>`;
      controlsHtml = `
        <div class="controls">
          ${player.running ? `<button class="btn ghost" data-action="pause">⏸ Pause</button>` : `<button class="btn primary" data-action="resume">${player.endAt===null?'▶ Démarrer':'▶ Reprendre'}</button>`}
          <button class="btn ghost" data-action="resetPhase">⟲ Reset</button>
          ${prevBtn}
          <button class="btn ghost" data-action="skip">⏭ Passer</button>
        </div>`;
    } else {
      centerHtml = `<div class="big-emoji">${st.exo.icon}</div><div class="reps-target">${st.exo.val} <span>reps</span></div>`;
      controlsHtml = `
        <div class="controls">
          <button class="btn primary" data-action="completeReps">✓ Série terminée</button>
          ${prevBtn}
          <button class="btn ghost" data-action="skip">⏭ Passer</button>
        </div>`;
    }
  } else if(player.phase==='rest'){
    centerHtml = `<div class="big-emoji">😮‍💨</div><div class="timer glow-rest">${formatTime(player.remaining)}</div>`;
    controlsHtml = `
      <div class="rest-adjust">
        <button class="btn ghost sm" data-action="restMinus">−15s</button>
        <button class="btn ghost sm" data-action="restPlus">+15s</button>
      </div>
      <div class="controls">
        ${player.running ? `<button class="btn ghost" data-action="pause">⏸ Pause</button>` : `<button class="btn primary" data-action="resume">${player.endAt===null?'▶ Démarrer':'▶ Reprendre'}</button>`}
        <button class="btn ghost" data-action="resetPhase">⟲ Reset</button>
        ${prevBtn}
        <button class="btn ghost" data-action="skip">⏭ Passer le repos</button>
      </div>`;
  }

  return `
  <div class="player" id="playerRoot">
    <div class="row between" style="margin-bottom:6px;">
      <button class="icon-btn" data-action="exitPlayer" title="Quitter" aria-label="Quitter la séance">✕</button>
      <span class="pill">${escapeHtml(s.name)}</span>
      <span class="pill">${player.stepIdx+1}/${totalSteps}</span>
    </div>
    <div class="progress-outer"><div class="progress-inner" style="width:${progressPct}%"></div></div>
    <span class="phase-tag ${player.phase}">${phaseLabel(st)}</span>
    <div class="exo-name">${escapeHtml(st.exo.name)}</div>
    ${st.exo.meta ? '' : `<div class="set-count">Série ${st.setIndex+1} / ${st.exo.sets}</div>`}
    ${st.exo.libId || st.exo.srcId ? `<button class="tips-btn" data-tips="${st.exo.libId || st.exo.srcId}">💡 Conseils &amp; sécurité</button>` : ''}
    ${centerHtml}
    ${controlsHtml}
    ${nextLabel? `<div class="next-preview">${nextLabel}</div>` : ''}
  </div>`;
}

function updatePlayerDom(){
  const root = document.getElementById('playerRoot');
  if(!root) return;
  const timerEl = root.querySelector('.timer');
  if(timerEl) timerEl.textContent = formatTime(player.sideBreak ? player.sideBreak.remaining : player.remaining);
  const progressEl = root.querySelector('.progress-inner');
  if(progressEl) progressEl.style.width = Math.round((player.stepIdx/player.steps.length)*100)+'%';
}

function phaseLabel(step){
  if(player.phase==='rest') return 'REPOS';
  if(step.exo.meta==='warmup') return 'ÉCHAUFFEMENT';
  if(step.exo.meta==='stretch') return 'ÉTIREMENT';
  return 'EN COURS';
}

function formatTime(sec){
  sec = Math.max(0,sec|0);
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

/* ---------------- HELPERS ---------------- */
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- EVENTS ---------------- */
/* Appui long fiable au doigt. Trois pièges évités :
   - le doigt bouge toujours un peu pendant un appui maintenu, donc on tolère
     un petit déplacement au lieu d'annuler au moindre pixel (et un appui long
     raté ne doit pas déclencher l'action courte par surprise) ;
   - on capture le pointeur pour ne pas perdre le relâchement si le doigt
     sort du bouton ;
   - une courte vibration confirme le déclenchement : plus besoin de deviner
     combien de temps tenir. */
const LONG_PRESS_MS = 500;
const LONG_PRESS_TOLERANCE = 14;
function attachLongPress(el, onShort, onLong){
  let timer = null, fired = false, cancelled = false, startX = 0, startY = 0;
  const clearTimer = ()=>{ if(timer){ clearTimeout(timer); timer = null; } };
  el.addEventListener('pointerdown', ev=>{
    fired = false; cancelled = false;
    startX = ev.clientX; startY = ev.clientY;
    try{ el.setPointerCapture(ev.pointerId); }catch(e){}
    clearTimer();
    timer = setTimeout(()=>{ timer = null; fired = true; vibrate(40); onLong(); }, LONG_PRESS_MS);
  });
  el.addEventListener('pointermove', ev=>{
    if(!timer) return;
    if(Math.abs(ev.clientX-startX) > LONG_PRESS_TOLERANCE || Math.abs(ev.clientY-startY) > LONG_PRESS_TOLERANCE) clearTimer();
  });
  el.addEventListener('pointerup', ()=>{
    clearTimer();
    if(!fired && !cancelled) onShort();
  });
  el.addEventListener('pointercancel', ()=>{ clearTimer(); cancelled = true; });
}
function attachEvents(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-nav]').forEach(b=>b.onclick = ()=>{
    view = b.getAttribute('data-nav');
    if(view==='builder' && !builderDraft) builderDraft = newDraft();
    render();
  });

  app.querySelectorAll('[data-libtab]').forEach(b=>b.onclick = ()=>{
    libTab = b.getAttribute('data-libtab');
    render();
  });

  app.querySelectorAll('[data-toggle]').forEach(b=>b.onclick = ()=>{
    const k = b.getAttribute('data-toggle');
    settings[k] = !settings[k];
    saveSettings(settings);
    // Activer la vibration la teste tout de suite : on la sent si elle marche,
    // et sinon le message dit précisément ce qui bloque.
    if(k === 'vibrate' && settings.vibrate){
      playVibration([120,60,120])
        .then(()=>toast('Vibration OK ✓'))
        .catch(err=>toast('Vibration indisponible : ' + ((err && err.message) || err)));
    }
    render();
  });

  app.querySelectorAll('[data-warmup-btn]').forEach(b=>attachLongPress(b,
    ()=>{ settings.warmup=!settings.warmup; saveSettings(settings); render(); },
    ()=>{ sheet={type:'warmupMode'}; render(); }
  ));
  // Appui court : son ON/OFF. Appui long : choix de la sonorité.
  app.querySelectorAll('[data-sound-btn]').forEach(b=>attachLongPress(b,
    ()=>{ settings.sound=!settings.sound; saveSettings(settings); if(settings.sound) beep(880,120,0.12); render(); },
    ()=>{ sheet={type:'soundProfile'}; render(); }
  ));
  app.querySelectorAll('[data-set-sound-profile]').forEach(b=>b.onclick = ()=>{
    settings.soundProfile = b.getAttribute('data-set-sound-profile');
    saveSettings(settings);
    render();
    // Se fait entendre même si le son est coupé : on est en train de le choisir.
    playTone(880, 140, 0.14);
    setTimeout(()=>playTone(1200, 180, 0.16), 170);
  });

  app.querySelectorAll('[data-move-session]').forEach(b=>b.onclick = ()=>{
    const i = parseInt(b.getAttribute('data-move-session'));
    const j = i + parseInt(b.getAttribute('data-dir'));
    if(j < 0 || j >= sessions.length) return;
    const [moved] = sessions.splice(i, 1);
    sessions.splice(j, 0, moved);
    saveSessions(sessions);
    render();
  });
  app.querySelectorAll('[data-move-exo]').forEach(b=>b.onclick = ()=>{
    const i = parseInt(b.getAttribute('data-move-exo'));
    const j = i + parseInt(b.getAttribute('data-dir'));
    if(!builderDraft || j < 0 || j >= builderDraft.exos.length) return;
    const [moved] = builderDraft.exos.splice(i, 1);
    builderDraft.exos.splice(j, 0, moved);
    render();
  });

  // Recherche : on réaffiche à chaque frappe, donc il faut rendre le focus et
  // replacer le curseur, sinon le champ se vide visuellement à chaque lettre.
  [['libSearch', v=>{ libSearch = v; }], ['pickSearch', v=>{ pickSearch = v; }]].forEach(([id, set])=>{
    const input = document.getElementById(id);
    if(!input) return;
    input.oninput = ()=>{
      const pos = input.selectionStart;
      set(input.value);
      render();
      const again = document.getElementById(id);
      if(again){ again.focus(); try{ again.setSelectionRange(pos, pos); }catch(e){} }
    };
  });
  app.querySelectorAll('[data-clear-search]').forEach(b=>b.onclick = ()=>{
    const id = b.getAttribute('data-clear-search');
    if(id === 'libSearch') libSearch = ''; else pickSearch = '';
    render();
    const again = document.getElementById(id);
    if(again) again.focus();
  });
  app.querySelectorAll('[data-set-warmup-mode]').forEach(b=>b.onclick = ()=>{
    settings.warmupMode = b.getAttribute('data-set-warmup-mode');
    saveSettings(settings);
    sheet=null;
    render();
  });

  app.querySelectorAll('[data-start-session]').forEach(b=>b.onclick = ()=>startSession(parseInt(b.getAttribute('data-start-session'))));
  app.querySelectorAll('[data-del-session]').forEach(b=>b.onclick = ()=>{
    const i = parseInt(b.getAttribute('data-del-session'));
    if(confirm('Supprimer la séance "'+sessions[i].name+'" ?')){
      sessions.splice(i,1); saveSessions(sessions); render();
    }
  });
  app.querySelectorAll('[data-edit-session]').forEach(b=>b.onclick = ()=>{
    const i = parseInt(b.getAttribute('data-edit-session'));
    builderDraft = JSON.parse(JSON.stringify(sessions[i]));
    builderDraft._editIndex = i;
    view='builder'; render();
  });

  // builder
  const nameInput = document.getElementById('sessionName');
  if(nameInput) nameInput.oninput = e=>{ builderDraft.name = e.target.value; };

  app.querySelectorAll('[data-stepper]').forEach(b=>b.onclick = ()=>{
    const field = b.getAttribute('data-stepper');
    const i = parseInt(b.getAttribute('data-i'));
    const d = parseInt(b.getAttribute('data-d'));
    const e = builderDraft.exos[i];
    if(field==='sets') e.sets = Math.max(1, e.sets+d);
    if(field==='val') e.val = Math.max(e.type==='time'?5:1, e.val+d);
    if(field==='rest') e.rest = Math.max(0, e.rest+d);
    render();
  });
  app.querySelectorAll('[data-remove-exo]').forEach(b=>b.onclick = ()=>{
    const i = parseInt(b.getAttribute('data-remove-exo'));
    builderDraft.exos.splice(i,1); render();
  });

  const actionMap = {
    openAddExo: ()=>{ pickSearch=''; sheet={type:'addExo'}; render(); },
    openCustomExo: ()=>{ sheet={type:'customExo', name:'', exoType:'reps', cat:CUSTOM_CAT_OPTIONS[0], muscles:[]}; render(); },
    openChangelog: ()=>{ sheet={type:'changelog', since:null, auto:false}; render(); },
    openEquipment: ()=>{ sheet={type:'equipment'}; render(); },
    openExport: ()=>{ sheet={type:'export'}; render(); },
    openImport: ()=>{ sheet={type:'import'}; render(); },
    openUpdate: ()=>{
      sheet={type:'update'}; updateState={status:'idle', info:null, error:null}; render();
      // Si un téléchargement est resté en cours (écran fermé, appli relancée),
      // on reprend son suivi au lieu de repartir de zéro.
      pollDownloadOnce().then(state=>{ if(state && state !== 'none' && state !== 'failed' && state !== 'installing') watchDownload(); });
    },
    cycleTheme: ()=>{
      const order = ['system','light','dark'];
      settings.theme = order[(order.indexOf(settings.theme)+1) % order.length];
      saveSettings(settings);
      applyTheme();
      render();
    },
    toggleAvoidLunges: ()=>{
      settings.avoidLunges = !settings.avoidLunges;
      saveSettings(settings);
      render();
    },
    checkUpdate: ()=>{
      updateState={status:'checking', info:null, error:null}; render();
      callAppUpdater('checkForUpdate').then(res=>{
        if(res && res.available){ updateState={status:'available', info:res, error:null}; }
        else{ updateState={status:'upToDate', info:res, error:null}; }
        // Une vérification manuelle fait foi : elle pose ou retire la pastille.
        setUpdateBadge(!!(res && res.available));
        render();
      }).catch(err=>{
        updateState={status:'error', info:null, error:(err && err.message) || String(err) || 'Vérification impossible.'};
        render();
      });
    },
    installUpdate: ()=>{
      if(!updateState.info){ updateState={status:'error', error:'Mise à jour indisponible.'}; render(); return; }
      updateState={status:'downloading', info:updateState.info, error:null, percent:null}; render();
      callAppUpdater('downloadAndInstall', { url: updateState.info.downloadUrl })
        .then(()=>watchDownload())
        .catch(err=>{
          updateState={status:'error', info:null, error:updateErrorText(err, 'Téléchargement impossible.')};
          render();
        });
    },
    cancelUpdate: ()=>{
      stopDownloadWatch();
      callAppUpdater('cancelDownload').catch(()=>{});
      updateState={status:'idle', info:null, error:null};
      render();
    },
    copyExport: ()=>{
      const ta = document.getElementById('exportArea');
      if(!ta) return;
      ta.select(); ta.setSelectionRange(0, 999999);
      try{
        navigator.clipboard.writeText(ta.value)
          .then(()=>toast('Copié dans le presse-papiers ✓'))
          .catch(()=>toast('Copie impossible ici : sélectionne le texte et fais Ctrl+C.'));
      }catch(e){ toast('Copie impossible ici : sélectionne le texte et fais Ctrl+C.'); }
    },
    doImport: ()=>{
      const ta = document.getElementById('importArea');
      const raw = ta ? ta.value.trim() : '';
      if(!raw){ toast("Colle d'abord un texte exporté."); return; }
      let data;
      try{ data = JSON.parse(raw); }catch(e){ toast('Texte invalide : vérifie que tu as bien tout copié.'); return; }
      if(!data || typeof data!=='object'){ toast('Format invalide.'); return; }
      if(!isValidImportData(data)){ toast('Le contenu importé est invalide ou incomplet : vérifie que tu as bien tout copié.'); return; }
      if(!confirm('Importer ces données ? Cela remplacera tes séances, exercices, équipement et suivi actuels.')) return;
      if(Array.isArray(data.sessions)){ sessions = data.sessions; saveSessions(sessions); }
      if(Array.isArray(data.customExos)){ customExos = data.customExos; saveCustomExos(customExos); }
      if(data.settings && typeof data.settings==='object'){ settings = Object.assign({sound:true,vibrate:true,soundProfile:'classic',theme:'system',warmup:true,warmupMode:'short',avoidLunges:false,lastSeenBuild:null,updateAvailable:false,updateCheckedAt:0}, data.settings); saveSettings(settings); applyTheme(); }
      if(data.equipment && typeof data.equipment==='object'){ equipment = Object.assign({pullupBar:false,dipBar:false,chair:false,bench:false,bands:false}, data.equipment); saveEquipment(equipment); }
      if(Array.isArray(data.logs)){ logs = data.logs; saveLogs(logs); }
      sheet=null; view='home'; toast('Données importées ✓'); render();
    },
    closeSheet: ()=>closeSheet(),
    newSession: ()=>{ builderDraft = newDraft(); view='builder'; render(); },
    cancelBuilder: ()=>{ builderDraft=null; view='home'; render(); },
    saveSession: ()=>{
      if(!builderDraft.name.trim()) builderDraft.name='Séance sans nom';
      if(builderDraft._editIndex!=null){
        sessions[builderDraft._editIndex] = builderDraft;
        delete sessions[builderDraft._editIndex]._editIndex;
      } else {
        sessions.push(builderDraft);
      }
      saveSessions(sessions);
      builderDraft=null; view='home'; toast('Séance enregistrée ✓'); render();
    },
    saveCustomExo: ()=>{
      const name = document.getElementById('customName').value.trim();
      if(!name){ toast('Donne un nom à ton exercice.'); return; }
      const type = document.getElementById('customType').value;
      const cat = document.getElementById('customCat').value;
      const muscles = (sheet.muscles || []).slice();
      const id = 'custom_'+Date.now();
      const entry = {id, name, cat, type, icon:'⭐', sets:3, val: type==='time'?30:12, rest:45, custom:true};
      if(muscles.length) entry.muscles = muscles;
      customExos.push(entry);
      saveCustomExos(customExos);
      sheet=null; toast('Exercice créé ✓'); render();
    },
    pause: pausePlayer,
    resume: resumePlayer,
    resumeNow: ()=>{ cancelResumeCountdown(); resumePlayer(); },
    resetPhase: resetPlayerPhase,
    skip: skipCurrent,
    prev: goToPrevStep,
    skipSideBreak: skipSideBreak,
    completeReps: completeRepsSet,
    restMinus: ()=>adjustRest(-15),
    restPlus: ()=>adjustRest(15),
    saveReview: saveReview,
    skipReview: exitPlayer,
    clearLogs: ()=>{
      if(confirm('Effacer tout l\'historique de suivi ?')){ logs=[]; saveLogs(logs); render(); }
    },
    exitPlayer: ()=>{
      if(player.phase==='review' || confirm('Quitter la séance en cours ?')) exitPlayer();
    }
  };
  app.querySelectorAll('[data-action]').forEach(b=>{
    const key = b.getAttribute('data-action');
    if(actionMap[key]) b.onclick = actionMap[key];
  });

  // Appui court sur "Mise à jour" : écran habituel. Appui long : page GitHub
  // de la release, pour installer à la main si la mise à jour intégrée coince.
  app.querySelectorAll('[data-update-btn]').forEach(b=>attachLongPress(b,
    ()=>actionMap.openUpdate(),
    ()=>window.open(UPDATE_RELEASE_PAGE_URL, '_blank')
  ));

  app.querySelectorAll('[data-tips]').forEach(b=>b.onclick = (ev)=>{
    ev.stopPropagation();
    // Pendant une séance, on ne laisse pas le chrono tourner pendant la lecture.
    const wasRunning = view==='player' && player.running;
    if(wasRunning) pausePlayer();
    sheet = {type:'tips', exoId:b.getAttribute('data-tips'), resumeOnClose:wasRunning};
    render();
  });

  app.querySelectorAll('[data-toggle-custom-muscle]').forEach(b=>b.onclick = ()=>{
    // On récupère d'abord ce qui est déjà saisi dans le formulaire, pour ne
    // pas le perdre quand on réaffiche la fiche après avoir (dés)activé un muscle.
    const nameEl = document.getElementById('customName');
    const typeEl = document.getElementById('customType');
    const catEl = document.getElementById('customCat');
    if(nameEl) sheet.name = nameEl.value;
    if(typeEl) sheet.exoType = typeEl.value;
    if(catEl) sheet.cat = catEl.value;
    const m = b.getAttribute('data-toggle-custom-muscle');
    sheet.muscles = sheet.muscles || [];
    const idx = sheet.muscles.indexOf(m);
    if(idx>=0) sheet.muscles.splice(idx,1); else sheet.muscles.push(m);
    render();
  });

  app.querySelectorAll('[data-toggle-equip]').forEach(b=>b.onclick = ()=>{
    const key = b.getAttribute('data-toggle-equip');
    equipment[key] = !equipment[key];
    saveEquipment(equipment);
    render();
  });

  app.querySelectorAll('[data-review-mode]').forEach(b=>b.onclick = ()=>{
    const i = parseInt(b.getAttribute('data-review-mode'));
    const ans = player.review[i];
    const exo = player.session.exos[i];
    ans.detailed = b.getAttribute('data-val')==='detail';
    if(!ans.detailed){
      ans.completed = true;
      ans.reps = Array.from({length: Math.max(1, exo.sets||1)}, ()=>exo.val);
    }
    render();
  });
  app.querySelectorAll('[data-review-rep]').forEach(inp=>inp.oninput = ()=>{
    const i = parseInt(inp.getAttribute('data-review-rep'));
    const si = parseInt(inp.getAttribute('data-set'));
    player.review[i].reps[si] = inp.value;
  });
  app.querySelectorAll('[data-feeling]').forEach(b=>b.onclick = ()=>{
    const v = b.getAttribute('data-feeling');
    player.feeling = player.feeling===v ? null : v;
    render();
  });
  const noteEl = document.getElementById('reviewNote');
  if(noteEl) noteEl.oninput = ()=>{ player.note = noteEl.value; };
  app.querySelectorAll('[data-del-log]').forEach(b=>b.onclick = ()=>{
    const i = parseInt(b.getAttribute('data-del-log'));
    if(confirm('Supprimer cette séance de ton suivi ?')){
      logs.splice(i,1); saveLogs(logs); render();
    }
  });

  app.querySelectorAll('[data-pick-exo]').forEach(b=>b.onclick = ()=>{
    const id = b.getAttribute('data-pick-exo');
    const e = allExoLibrary().find(x=>x.id===id);
    builderDraft.exos.push({libId:e.id, name:e.name, icon:e.icon, type:e.type, sets:e.sets, val:e.val, rest:e.rest});
    sheet=null; render();
  });
  app.querySelectorAll('[data-del-custom]').forEach(b=>b.onclick = (ev)=>{
    ev.stopPropagation();
    const id = b.getAttribute('data-del-custom');
    customExos = customExos.filter(x=>x.id!==id);
    saveCustomExos(customExos); render();
  });

  const overlay = app.querySelector('[data-close-sheet]');
  if(overlay) overlay.onclick = (e)=>{ if(e.target===overlay) closeSheet(); };
}

/* Au premier lancement suivant une mise à jour, on ouvre le journal tout seul.
   Une première installation ne déclenche rien : il n'y a pas de "avant". */
function prepareChangelogNotice(){
  if(settings.lastSeenBuild === APP_BUILD) return;
  const since = settings.lastSeenBuild;
  settings.lastSeenBuild = APP_BUILD;
  saveSettings(settings);
  if(!hadStoredSettings) return;
  sheet = {type:'changelog', since, auto:true};
}

applyTheme();
prepareChangelogNotice();
render();
refreshUpdateBadge();
})();
</script>
