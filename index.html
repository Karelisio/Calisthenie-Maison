<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kalisto</title>
<meta name="theme-color" content="#12140f">
<meta name="description" content="Séances de calisthénie sans matériel, avec minuteur intégré.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /*
   * Material 3 tonal palette — seed hue: the app's own orange/teal
   * brand colors (same as the base app), just carried as M3 roles
   * instead of gradients. The accent roles (primary/tertiary/error)
   * stay constant across themes — only the neutral surface tokens swap
   * between light (bare :root, default) and dark (prefers-color-scheme
   * for "system", [data-theme="dark"] for an explicit choice, so both
   * directions of the toggle win over "system").
   * --accent/--accent2/etc. are kept as the names the rest of the app
   * already renders with, so a native "dynamic color" plugin can still
   * override them at runtime from the wallpaper's colors (dark scheme
   * only — see initDynamicTheme()).
   */
  :root{
    --md-primary:#ff7a45;             --md-on-primary:#1a0d05;
    --md-primary-container:#5c2a0f;   --md-on-primary-container:#ffdbc7;
    --md-tertiary:#22c3a6;            --md-on-tertiary:#04241d;
    --md-tertiary-container:#0d3f34;  --md-on-tertiary-container:#bdf2e6;
    --md-error:#ff5566;               --md-on-error:#2c0002;
    --md-error-container:#63000a;     --md-on-error-container:#ffd9d9;

    --md-surface:#fbfbf3;
    --md-surface-container-low:#f5f4ec;
    --md-surface-container:#eff0e6;
    --md-surface-container-high:#e9eae0;
    --md-surface-container-highest:#e3e4da;
    --md-on-surface:#1a1c17;
    --md-on-surface-variant:#44483c;
    --md-outline:#75796c;
    --md-outline-variant:#c4c8b9;

    --bg:var(--md-surface);
    --bg2:var(--md-surface-container-low);
    --card:var(--md-surface-container);
    --card2:var(--md-surface-container-high);
    --border:var(--md-outline-variant);
    --text:var(--md-on-surface);
    --muted:var(--md-on-surface-variant);

    --accent:var(--md-primary);              --on-accent:var(--md-on-primary);
    --accent-container:var(--md-primary-container); --on-accent-container:var(--md-on-primary-container);
    --accent2:var(--md-tertiary);            --on-accent2:var(--md-on-tertiary);
    --accent2-container:var(--md-tertiary-container); --on-accent2-container:var(--md-on-tertiary-container);
    --danger:var(--md-error);

    --radius:12px;
    --radius-lg:20px;
    --radius-full:999px;

    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --md-surface:#12140f;
      --md-surface-container-low:#1a1c16;
      --md-surface-container:#1e2018;
      --md-surface-container-high:#282a22;
      --md-surface-container-highest:#33352c;
      --md-on-surface:#e2e3d9;
      --md-on-surface-variant:#c4c8b9;
      --md-outline:#8e9285;
      --md-outline-variant:#44483c;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --md-surface:#12140f;
    --md-surface-container-low:#1a1c16;
    --md-surface-container:#1e2018;
    --md-surface-container-high:#282a22;
    --md-surface-container-highest:#33352c;
    --md-on-surface:#e2e3d9;
    --md-on-surface-variant:#c4c8b9;
    --md-outline:#8e9285;
    --md-outline-variant:#44483c;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(900px 520px at 108% 115%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 60%),
      radial-gradient(700px 480px at -8% -8%, color-mix(in srgb, var(--accent2) 10%, transparent), transparent 60%),
      var(--bg);
    background-color:var(--bg);
    background-attachment:fixed;
    color:var(--text);
    font-family:Roboto,"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:640px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));}
  h1,h2,h3{margin:0 0 4px;font-weight:500;letter-spacing:0;}
  h1{font-size:22px;}
  h2{font-size:17px;}
  p{margin:4px 0;color:var(--muted);font-size:14px;line-height:1.4;}
  .row{display:flex;align-items:center;gap:10px;}
  .between{justify-content:space-between;}
  .wrap{flex-wrap:wrap;}
  .header{
    position:sticky;top:0;z-index:20;
    background:var(--bg);
    padding:calc(16px + env(safe-area-inset-top)) 16px 8px;
    margin:calc(-20px - env(safe-area-inset-top)) -16px 16px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .logo{
    width:40px;height:40px;border-radius:var(--radius);
    background:var(--accent-container);color:var(--on-accent-container);
    display:flex;align-items:center;justify-content:center;font-size:20px;
  }
  nav.tabs{display:flex;gap:6px;margin-top:14px;}
  nav.tabs button{
    flex:1;background:var(--card);border:1px solid var(--border);color:var(--muted);
    padding:10px 4px;min-height:46px;border-radius:var(--radius);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;
    transition:transform .15s ease,filter .15s ease;
  }
  nav.tabs button.active{
    background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 65%, white));
    color:var(--on-accent);border-color:transparent;
    box-shadow:0 8px 20px -10px color-mix(in srgb, var(--accent) 60%, transparent), 0 1px 0 rgba(255,255,255,.3) inset;
  }

  .card{
    background:var(--card);
    border-radius:var(--radius);
    padding:16px;margin-bottom:14px;
    box-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  .card.tight{padding:12px 14px;}
  .card:active{filter:brightness(1.04);}

  /* Sans ça, un appui long sur un bouton déclenche la sélection de texte /
     le menu contextuel d'Android, qui interrompt le geste. */
  button, .lib-item{
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit;touch-action:manipulation;}
  /* Les tailles tactiles suivent le minimum recommandé par Android (48dp) :
     en dessous, un appui sur le bord du bouton rate régulièrement sa cible. */
  .btn{
    position:relative;overflow:hidden;isolation:isolate;
    border:none;border-radius:var(--radius);padding:12px 18px;font-size:14px;font-weight:600;
    min-height:48px;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    cursor:pointer;color:var(--text);background:var(--card2);
    box-shadow:0 1px 0 rgba(255,255,255,.06) inset;
    transition:transform .15s ease, filter .15s ease;
  }
  .btn::before{
    content:'';position:absolute;inset:0;z-index:-1;
    background:linear-gradient(180deg, rgba(255,255,255,.22), transparent 55%);
    opacity:0;transition:opacity .15s ease;pointer-events:none;
  }
  .btn.primary::before, .btn.accent::before{opacity:1;}
  /* Effets de survol réservés à la souris : au doigt, le survol reste "collé"
     après un appui et laisse le bouton dans un état visuel faussement actif. */
  @media (hover:hover){
    .btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.06);}
  }
  .btn:active:not(:disabled){transform:translateY(0);filter:brightness(.95);}
  .btn.primary{
    background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 65%, white));
    color:var(--on-accent);
    box-shadow:0 10px 24px -12px color-mix(in srgb, var(--accent) 60%, transparent);
  }
  .btn.accent{
    background:linear-gradient(135deg, var(--accent2), color-mix(in srgb, var(--accent2) 65%, white));
    color:var(--on-accent2);
    box-shadow:0 10px 24px -12px color-mix(in srgb, var(--accent2) 60%, transparent);
  }
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn.danger{background:color-mix(in srgb, var(--danger) 16%, transparent);color:var(--danger);border:1px solid color-mix(in srgb, var(--danger) 35%, transparent);}
  .btn.block{width:100%;}
  .btn.sm{padding:8px 14px;min-height:42px;font-size:12px;border-radius:12px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  /* Pastille de notification. Placée bien à l'intérieur du bouton : .btn a
     overflow:hidden et des coins arrondis, un point collé à l'angle serait
     rogné. */
  .has-dot::after{
    content:'';position:absolute;top:7px;right:9px;
    width:8px;height:8px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 2px var(--card);
  }
  .icon-btn{
    width:44px;height:44px;border-radius:12px;
    background:linear-gradient(160deg, var(--card2), var(--card));
    color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;
    border:none;box-shadow:0 1px 0 rgba(255,255,255,.07) inset;
    transition:transform .15s ease, filter .15s ease;
  }
  @media (hover:hover){
    .icon-btn:hover{transform:translateY(-1px);filter:brightness(1.15);}
  }
  .icon-btn:active{filter:brightness(.92);}
  .icon-btn:disabled{opacity:.3;cursor:not-allowed;}
  .icon-btn:disabled:active{filter:none;}

  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--card2);
    padding:5px 12px;border-radius:var(--radius-full);font-size:12px;color:var(--muted);}
  .badge{background:var(--accent-container);color:var(--on-accent-container);padding:2px 8px;border-radius:var(--radius-full);font-size:11px;font-weight:700;}

  input[type=text], input[type=number], select, textarea{
    width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--text);
    padding:12px;border-radius:8px;font-size:14px;font-family:inherit;
    transition:border-color .15s ease;
  }
  input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus{border-color:var(--accent);outline:none;}
  textarea{resize:vertical;}
  textarea.code{min-height:220px;font-family:monospace;font-size:11px;}
  label.field{display:block;margin-bottom:10px;}
  label.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}

  .exo-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--radius);background:var(--bg2);margin-bottom:8px;}
  .exo-item .emoji{font-size:22px;width:34px;text-align:center;}
  .exo-item .meta{flex:1;min-width:0;}
  .exo-item .meta b{display:block;font-size:14px;font-weight:500;}
  .exo-item .meta small{color:var(--muted);}
  .stepper{display:flex;align-items:center;gap:10px;}
  .stepper button{width:42px;height:42px;border-radius:50%;background:var(--card2);border:none;color:var(--text);cursor:pointer;font-size:18px;line-height:1;}
  .stepper button:active{filter:brightness(.9);}
  .stepper span{min-width:30px;text-align:center;font-size:14px;font-weight:700;}
  .stepper-col{display:flex;flex-direction:column;align-items:flex-start;gap:4px;}
  .stepper-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}

  .set-field{width:92px;flex:0 0 auto;}
  .set-field input{text-align:center;padding:10px 6px;}

  .search-field{position:relative;margin-bottom:12px;}
  .search-field input{padding-left:40px;padding-right:44px;min-height:48px;}
  .search-field .search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.7;pointer-events:none;}
  .search-clear{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);
    width:40px;height:40px;border:none;background:transparent;color:var(--muted);
    font-size:15px;cursor:pointer;border-radius:50%;
  }
  .search-clear:active{background:var(--card2);}

  .empty{text-align:center;padding:40px 10px;color:var(--muted);}
  .empty .big{font-size:40px;margin-bottom:8px;}

  /* Player */
  .player{text-align:center;}
  .progress-outer{height:6px;background:var(--card2);border-radius:var(--radius-full);overflow:hidden;margin-bottom:18px;}
  .progress-inner{height:100%;background:var(--accent);transition:width .3s;}
  .phase-tag{display:inline-block;padding:6px 16px;border-radius:var(--radius-full);font-size:12px;font-weight:700;letter-spacing:.3px;margin-bottom:10px;}
  .phase-tag.work{background:var(--accent-container);color:var(--on-accent-container);}
  .phase-tag.rest{background:var(--accent2-container);color:var(--on-accent2-container);}
  .phase-tag.done{background:var(--card2);color:var(--text);}
  .exo-name{font-size:24px;font-weight:500;margin:6px 0 2px;}
  .set-count{color:var(--muted);font-size:14px;margin-bottom:18px;}
  .big-emoji{font-size:56px;margin:6px 0;}
  .timer{font-size:76px;font-weight:500;font-variant-numeric:tabular-nums;margin:6px 0 14px;letter-spacing:1px;}
  .timer.glow-work{color:var(--accent);}
  .timer.glow-rest{color:var(--accent2);}
  .side-switch-label{font-size:16px;font-weight:600;color:var(--accent2);margin:-8px 0 14px;}
  .reps-target{font-size:56px;font-weight:500;margin:6px 0 14px;color:var(--accent);}
  .reps-target span{font-size:22px;color:var(--muted);font-weight:500;}
  .controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
  .controls .btn{min-width:90px;}
  .rest-adjust{display:flex;justify-content:center;gap:10px;margin:10px 0;}
  .next-preview{margin-top:18px;color:var(--muted);font-size:13px;}
  .next-preview b{color:var(--text);}

  .toast{
    position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--md-surface-container-highest);color:var(--text);padding:10px 18px;border-radius:var(--radius-full);font-size:13px;
    box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .toast.show{opacity:1;}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
  .sheet{background:var(--md-surface-container-low);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:18px 16px calc(26px + env(safe-area-inset-bottom));width:100%;max-width:640px;max-height:85vh;overflow-y:auto;}
  .sheet h3{margin-bottom:14px;font-weight:500;}
  .cat-title{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 0 8px;}
  .lib-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--radius);cursor:pointer;touch-action:manipulation;}
  .lib-item:active{background:var(--card2);}
  .lib-item .emoji{font-size:22px;width:32px;text-align:center;}
  .lib-item b{font-size:14px;display:block;font-weight:500;}
  .lib-item small{color:var(--muted);}

  .release-entry{padding:14px 0;border-top:1px solid var(--border);}
  .release-entry:first-of-type{border-top:none;padding-top:0;}

  .tips-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px;}
  .tips-list li{padding-left:24px;position:relative;font-size:14px;line-height:1.55;color:var(--text);}
  .tips-list li:before{content:'✓';position:absolute;left:0;top:0;color:var(--accent2);font-weight:700;}
  .tips-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent2-container);color:var(--on-accent2-container);border:none;padding:10px 16px;min-height:44px;border-radius:var(--radius-full);font-size:13px;font-weight:600;cursor:pointer;margin-bottom:16px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
(function(){
"use strict";

/* ---------------- DATA ---------------- */
const EXO_LIB = [
 {id:'pushup', name:'Pompes', cat:'Haut du corps – Push', icon:'💪', type:'reps', sets:3, val:12, rest:60, muscles:['Pectoraux','Triceps','Épaules'], tips:[
   "Aligne tête, bassin et talons en une ligne droite, gainage abdominal actif.",
   "Coudes à environ 45° du buste (pas écartés à 90°) pour protéger les épaules.",
   "Descends jusqu'à effleurer le sol avec la poitrine, remonte sans bloquer les coudes en extension."]},
 {id:'pushup_diamond', name:'Pompes diamant', cat:'Haut du corps – Push', icon:'💎', type:'reps', sets:3, val:8, rest:60, muscles:['Triceps','Pectoraux','Épaules'], tips:[
   "Mains jointes sous le sternum, pouces et index qui se touchent.",
   "Coudes proches du corps, descente lente et contrôlée.",
   "Sollicite fortement les poignets : arrête si tu sens une douleur à cet endroit."]},
 {id:'pushup_incline', name:'Pompes mains surélevées', cat:'Haut du corps – Push', icon:'🔼', type:'reps', sets:3, val:15, rest:45, muscles:['Pectoraux','Triceps','Épaules'], tips:[
   "Mains posées sur un support stable (table, marche, canapé) plus haut que les pieds.",
   "Plus l'appui est haut, plus l'exercice est facile — idéal pour progresser en douceur.",
   "Garde le corps gainé en ligne droite, sans casser les hanches vers le bas."]},
 {id:'pike_pushup', name:'Pompes piquées (épaules)', cat:'Haut du corps – Push', icon:'🔺', type:'reps', sets:3, val:8, rest:60, muscles:['Épaules','Triceps','Trapèzes'], tips:[
   "Position en V inversé, hanches hautes, mains et pieds au sol.",
   "Plie les coudes vers l'arrière pour amener le sommet du crâne entre les mains.",
   "Regarde vers tes pieds plutôt que devant toi pour protéger la nuque."]},
 {id:'triceps_dip_air', name:'Extensions triceps au sol', cat:'Haut du corps – Push', icon:'🦾', type:'reps', sets:3, val:12, rest:45, muscles:['Triceps','Épaules'], tips:[
   "Position de pompe, coudes serrés le long du corps (pas écartés).",
   "Ne fléchis que les coudes, garde les épaules stables.",
   "Évite de creuser le bas du dos pendant le mouvement."]},
 {id:'table_row', name:'Tirage sous table (Rowing)', cat:'Haut du corps – Pull', icon:'🚣', type:'reps', sets:3, val:12, rest:60, muscles:['Dos','Biceps','Avant-bras'], tips:[
   "Allonge-toi sous une table solide et stable (vérifie qu'elle ne bouge pas avant de commencer), attrape le rebord à largeur d'épaules.",
   "Corps gainé en ligne droite des talons à la tête, tire la poitrine vers la table en serrant les omoplates.",
   "Redescends lentement sans reposer complètement le dos au sol entre deux répétitions, et évite toute table pliante ou fragile."]},
 {id:'ytw_raise', name:'Y-T-W (dos & épaules)', cat:'Haut du corps – Pull', icon:'🦅', type:'reps', sets:3, val:10, rest:45, muscles:['Trapèzes','Dos','Épaules'], tips:[
   "Allongé sur le ventre, lève les bras tendus en formant un Y, puis un T, puis un W, en serrant les omoplates à chaque position.",
   "Amplitude modérée : la contraction entre les omoplates compte plus que la hauteur atteinte par les bras.",
   "Garde la nuque neutre et évite de cambrer excessivement le bas du dos."]},
 {id:'towel_row_door', name:'Tirage horizontal (serviette + porte)', cat:'Haut du corps – Pull', icon:'🚪', type:'reps', sets:3, val:12, rest:60, muscles:['Dos','Biceps','Avant-bras'], tips:[
   "Ouvre la porte à moitié, passe une serviette autour du poignet de la porte et tiens une extrémité dans chaque main de part et d'autre.",
   "Penche-toi en arrière bras tendus, puis tire ton corps vers la porte en gardant le dos droit et le gainage actif.",
   "Teste impérativement la solidité de la porte et des gonds avant de charger tout ton poids dessus."]},
 {id:'towel_pullup_door', name:'Traction verticale (serviette + porte)', cat:'Haut du corps – Pull', icon:'🧗', type:'reps', sets:3, val:6, rest:90, muscles:['Dos','Biceps','Avant-bras'], tips:[
   "Passe la serviette par-dessus le haut du battant, idéalement près des charnières, puis ferme la porte pour la bloquer.",
   "Tiens les deux extrémités, penche-toi légèrement en arrière et tire-toi vers le haut jusqu'à ce que ton menton dépasse le niveau de la porte.",

   "Évite les portes intérieures creuses (la plupart des portes d'intérieur le sont) : privilégie une porte pleine/extérieure, ou utilise une vraie barre de traction si tu as un doute.",
   "Sollicite aussi fortement la force de préhension (grip) des avant-bras — normal de fatiguer vite au début."]},
 {id:'pull_up', name:'Tractions à la barre (pronation)', cat:'Haut du corps – Pull', icon:'⬆️', type:'reps', sets:3, val:6, rest:90, equip:'pullupBar', muscles:['Dos','Biceps','Avant-bras','Épaules'], tips:[
   "Saisis la barre en pronation (paumes vers l'avant), mains un peu plus larges que les épaules.",
   "Engage les omoplates avant de tirer avec les bras, monte jusqu'à ce que le menton dépasse la barre, redescends en contrôlant le mouvement.",
   "Évite de te balancer (kipping) tant que la technique stricte n'est pas maîtrisée, pour protéger les épaules.",
   "Vérifie que la barre est solidement fixée et supporte ton poids avant de t'y suspendre."]},
 {id:'chin_up', name:'Tractions à la barre (supination)', cat:'Haut du corps – Pull', icon:'💪', type:'reps', sets:3, val:6, rest:90, equip:'pullupBar', muscles:['Biceps','Dos','Avant-bras'], tips:[

/* Combien d'items on retient selon le mode choisi (Court ≈ 3 min, Long ≈ 7 min). */
const FLEX_PLAN = {
  short: { raise:1, mobilise:4, potentiate:0, stretches:4 },
  long:  { raise:2, mobilise:7, potentiate:2, stretches:8 },
};
function matchesMuscle(entry, muscle){
  return (entry.muscles||[]).some(m=>muscle.startsWith(m) || m.startsWith(muscle));
}
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
/* Vrai si l'exercice est un mouvement en fente, à exclure quand l'utilisateur
   a désactivé ce type d'exercice (ex : gêne au genou). */
function isLungeBlocked(e){ return !!(settings.avoidLunges && e.lunge); }

/* Poids de chaque muscle dans une séance. Une simple liste de muscles ne
   suffit pas : une séance de 3 exercices de poussée et 1 de jambes cite
   autant "Quadriceps" que "Pectoraux", et l'échauffement se retrouvait tiré
   au hasard parmi tout ça. On compte donc le volume réel — le nombre de
   séries qui sollicitent chaque muscle — en donnant plus de poids au premier
   muscle listé d'un exercice, qui en est le muscle principal. */
const SECONDARY_MUSCLE_WEIGHT = 0.45;
function getSessionMuscleWeights(session){
  const weights = {};
  session.exos.forEach(e=>{
    const libExo = getExoById(e.libId);
    const muscles = (libExo && libExo.muscles) ? libExo.muscles : [];
    const sets = Math.max(1, e.sets || 1);
    muscles.forEach((m, idx)=>{
      weights[m] = (weights[m] || 0) + sets * (idx === 0 ? 1 : SECONDARY_MUSCLE_WEIGHT);
    });
  });
  return weights;
}
/* Pertinence d'un échauffement/étirement pour une séance : somme des poids
   des muscles de la séance qu'il couvre. */
function flexScore(entry, weights){
  let score = 0;
  (entry.muscles||[]).forEach((em, idx)=>{
    const share = idx === 0 ? 1 : SECONDARY_MUSCLE_WEIGHT;
    Object.keys(weights).forEach(m=>{
      if(m.startsWith(em) || em.startsWith(m)) score += weights[m] * share;
    });
  });
  return score;
}
/* Prend jusqu'à `count` entrées, les plus pertinentes d'abord, puis des
   entrées générales s'il en manque. */
function pickFlexItems(pool, weights, count){
  if(count<=0) return [];
  const available = pool.filter(e=>hasEquipment(e) && !isLungeBlocked(e));
  const scored = available.map(e=>({
    entry: e,
    // Un peu d'aléatoire pour ne pas rejouer exactement la même sélection à
    // chaque séance, mais pas assez pour qu'un candidat hors sujet passe
    // devant un candidat nettement plus pertinent.
    score: flexScore(e, weights) * (0.85 + 0.3*Math.random())
  }));
  const matched = scored.filter(s=>s.score > 0).sort((a,b)=>b.score-a.score).map(s=>s.entry);
  const rest = shuffled(available.filter(e=>!matched.includes(e)));
  return [...matched, ...rest].slice(0, count);
}
/* Temps de transition entre deux mouvements : de quoi changer de position,
   se replacer au sol ou attraper la barre sans courir après le chrono. */
const FLEX_REST = { warmup: 12, stretch: 15 };
/* Pause automatique à mi-mouvement pour les exercices "sides" (un côté puis
   l'autre) : le temps de vraiment changer de position sans courir après le
   chrono, plutôt qu'un simple bip qu'il faut suivre du coin de l'œil. */
const SIDE_SWITCH_SEC = 5;
function toFlexExo(entry, meta, rest){
  return {libId:null, srcId:entry.id, meta, name:entry.name, icon:entry.icon, type:'time', sets:1, val:entry.val, rest, sides:!!entry.sides};
}
function buildWarmupExos(session){
  const plan = FLEX_PLAN[settings.warmupMode==='long' ? 'long' : 'short'];
  const weights = getSessionMuscleWeights(session);
  const byCat = cat => WARMUP_LIB.filter(w=>w.cat===cat);
  const picked = [
    ...pickFlexItems(byCat('raise'), weights, plan.raise),
    ...pickFlexItems([...byCat('mobilise'), ...byCat('activate')], weights, plan.mobilise),
    ...pickFlexItems(byCat('potentiate'), weights, plan.potentiate),
  ];
  return picked.map(w=>toFlexExo(w, 'warmup', FLEX_REST.warmup));
}
function buildStretchExos(session){
  const plan = FLEX_PLAN[settings.warmupMode==='long' ? 'long' : 'short'];
  const weights = getSessionMuscleWeights(session);
  return pickFlexItems(STRETCH_LIB, weights, plan.stretches).map(s=>toFlexExo(s, 'stretch', FLEX_REST.stretch));
}

/* Validation légère d'un import avant de l'accepter : évite qu'un texte
   collé mal formé (mauvaise copie, fichier abîmé) ne mette l'app dans un
   état cassé après coup. */
function isPlainObject(x){ return !!x && typeof x==='object' && !Array.isArray(x); }
function isValidSessionShape(s){
  return isPlainObject(s) && typeof s.name==='string' && Array.isArray(s.exos) &&
    s.exos.every(e => isPlainObject(e) && typeof e.name==='string' && (e.type==='reps'||e.type==='time') &&
      typeof e.sets==='number' && typeof e.val==='number' && typeof e.rest==='number');
}
function isValidImportData(data){
  if(!isPlainObject(data)) return false;
  if(data.sessions!==undefined && (!Array.isArray(data.sessions) || !data.sessions.every(isValidSessionShape))) return false;
  if(data.customExos!==undefined && (!Array.isArray(data.customExos) || !data.customExos.every(e=>isPlainObject(e) && typeof e.id==='string' && typeof e.name==='string'))) return false;
  if(data.settings!==undefined && !isPlainObject(data.settings)) return false;
  if(data.equipment!==undefined && !isPlainObject(data.equipment)) return false;
  if(data.logs!==undefined && !Array.isArray(data.logs)) return false;
  return true;
}

function isNativeApp(){
  return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
}
function callNativePlugin(pluginName, method, options){
  if(!isNativeApp() || !window.Capacitor.nativePromise) return Promise.reject(new Error('Indisponible hors application native.'));
  return window.Capacitor.nativePromise(pluginName, method, options||{});
}
function callAppUpdater(method, options){ return callNativePlugin('AppUpdater', method, options); }

/* Pastille "mise à jour disponible" sur le bouton des réglages.
   La vérification tourne en arrière-plan au lancement, mais pas plus d'une
   fois toutes les 6 h : inutile d'interroger GitHub à chaque ouverture de
   l'app. Le résultat est mémorisé, donc la pastille s'affiche immédiatement
   au lancement suivant sans attendre le réseau. */
const UPDATE_CHECK_INTERVAL_MS = 6*60*60*1000;
function setUpdateBadge(available){
  const changed = settings.updateAvailable !== available;
  settings.updateAvailable = available;
  settings.updateCheckedAt = Date.now();
  saveSettings(settings);
  return changed;
}
function refreshUpdateBadge(){
  if(!isNativeApp()) return;
  if(settings.updateCheckedAt && Date.now() - settings.updateCheckedAt < UPDATE_CHECK_INTERVAL_MS) return;
  callAppUpdater('checkForUpdate').then(res=>{
    const changed = setUpdateBadge(!!(res && res.available));
    // On ne réaffiche que si l'écran d'accueil est tranquille : surtout pas
    // pendant une séance ou pendant qu'une fiche est ouverte et remplie.
    if(changed && view === 'home' && !sheet) render();
  }).catch(()=>{
    // Hors connexion ou GitHub injoignable : on laisse l'état tel quel
    // plutôt que d'annoncer à tort qu'il n'y a rien de neuf.
  });
}
function updateErrorText(err, fallback){
  const msg = (err && (err.message || err.errorMessage)) || (typeof err === 'string' ? err : '');
  return msg || fallback;
}
/* Suivi actif du téléchargement : on interroge Android une fois par seconde
   plutôt que d'attendre une diffusion système qui peut ne jamais arriver —
   c'est ce qui laissait l'écran figé sur "Téléchargement…" sans rien dire. */
let downloadWatch = null;
function stopDownloadWatch(){ if(downloadWatch){ clearInterval(downloadWatch); downloadWatch = null; } }
function pollDownloadOnce(){
  return callAppUpdater('getDownloadStatus').then(res=>{
    const state = res && res.state;
    if(!state || state === 'none'){ stopDownloadWatch(); return state; }
    if(state === 'failed'){
      stopDownloadWatch();
      updateState = {status:'error', info:null, error:'Téléchargement échoué : ' + (res.reason || 'raison inconnue') + '.'};
      render();
      return state;
    }
    if(state === 'installing'){
      stopDownloadWatch();
      updateState = {status:'installing', info:updateState.info, error:null};
      render();
      return state;
    }
    const pct = (typeof res.percent === 'number') ? res.percent : null;
    const label = state === 'paused' ? (res.reason || 'en pause')
                : state === 'pending' ? 'en attente du démarrage…' : '';
    if(updateState.status !== 'downloading' || updateState.percent !== pct || updateState.stateLabel !== label){
      updateState = {status:'downloading', info:updateState.info, error:null, percent:pct, stateLabel:label};
      render();
    }
    return state;
  }).catch(err=>{
    stopDownloadWatch();
    updateState = {status:'error', info:null, error:updateErrorText(err, 'Suivi du téléchargement impossible.')};
    render();
  });
}
function watchDownload(){
  stopDownloadWatch();
  pollDownloadOnce();
  downloadWatch = setInterval(pollDownloadOnce, 1000);
}

/* Material You: tint the app's M3 tokens with the device's wallpaper-derived
   colors (Android 12+), falling back to the static palette otherwise. */
function applyDynamicColors(c){
  const root = document.documentElement.style;
  const map = {
    accent:'--accent', onAccent:'--on-accent', accentContainer:'--accent-container', onAccentContainer:'--on-accent-container',
    accent2:'--accent2', onAccent2:'--on-accent2', accent2Container:'--accent2-container', onAccent2Container:'--on-accent2-container',
    bg:'--bg', bg2:'--bg2', card:'--card', card2:'--card2', border:'--border', text:'--text', muted:'--muted'
  };
  Object.keys(map).forEach(k=>{ if(c[k]) root.setProperty(map[k], c[k]); });
}
function initDynamicTheme(){
  if(!isNativeApp()){ clearDynamicColors(); return; }
  callNativePlugin('MaterialColors', 'getDynamicColors', { scheme: resolvedTheme() }).then(res=>{
    if(res && res.available) applyDynamicColors(res); else clearDynamicColors();
  }).catch(()=>{ clearDynamicColors(); });
}
function clearDynamicColors(){
  const root = document.documentElement.style;
  ['--accent','--on-accent','--accent-container','--on-accent-container',
   '--accent2','--on-accent2','--accent2-container','--on-accent2-container',
   '--bg','--bg2','--card','--card2','--border','--text','--muted'].forEach(v=>root.removeProperty(v));
}

/* ---------------- ÉCRAN ALLUMÉ ----------------
 * Une séance se suit de loin, sans toucher le téléphone : l'écran ne doit pas
 * s'éteindre en plein gainage. Dans l'app native on pose un drapeau sur la
 * fenêtre (fiable et persistant) ; en PWA on se rabat sur l'API Wake Lock,
 * qui se relâche dès que l'onglet passe en arrière-plan et qu'il faut donc
 * redemander au retour. Actif seulement pendant la séance. */
let keepAwakeWanted = false;
let wakeLockSentinel = null;
function requestWebWakeLock(){
  try{
    if(!navigator.wakeLock || wakeLockSentinel) return;
    navigator.wakeLock.request('screen')
      .then(s=>{ wakeLockSentinel = s; s.addEventListener('release', ()=>{ wakeLockSentinel = null; }); })
      .catch(()=>{});
  }catch(e){}
}
function releaseWebWakeLock(){
  if(!wakeLockSentinel) return;
  try{ wakeLockSentinel.release(); }catch(e){}
  wakeLockSentinel = null;
}
function setKeepAwake(on){
  keepAwakeWanted = on;
  if(isNativeApp()){
    callNativePlugin('ScreenAwake', 'setKeepAwake', {on}).catch(()=>{});
    return;
  }
  if(on) requestWebWakeLock(); else releaseWebWakeLock();
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && keepAwakeWanted && !isNativeApp()) requestWebWakeLock();
});

const THEME_LABELS = { system:'⚙️ Système', light:'☀️ Clair', dark:'🌙 Sombre' };
function resolvedTheme(){
  if(settings.theme === 'light' || settings.theme === 'dark') return settings.theme;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function applyTheme(){
  if(settings.theme === 'light' || settings.theme === 'dark'){
    document.documentElement.setAttribute('data-theme', settings.theme);
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
  initDynamicTheme();
}
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if(settings.theme === 'system') applyTheme();
  });
}

/* Recherche insensible aux accents et à la casse : taper "echauffement" ou
   "pectoraux" doit trouver "Échauffement" et "Pectoraux". */
function normalizeText(str){
  return String(str||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
}
function matchesSearch(exo, query){
  const q = normalizeText(query).trim();
  if(!q) return true;
  const haystack = normalizeText([
    exo.name, exo.cat, exo.level, (exo.muscles||[]).join(' ')
  ].filter(Boolean).join(' '));
  // Chaque mot tapé doit être présent : "pompes triceps" trouve les pompes
  // qui travaillent les triceps.
  return q.split(/\s+/).every(word => haystack.includes(word));
}

/* Estimation de ce que l'échauffement et les étirements ajoutent à une séance.
   Le contenu étant tiré au hasard à chaque démarrage, on se base sur le nombre
   d'items prévus par le mode et sur la durée moyenne des bibliothèques. */
function avgVal(list){ return list.length ? list.reduce((a,e)=>a+e.val,0)/list.length : 0; }
function estimateFlexSeconds(){
  if(!settings.warmup) return 0;
  const plan = FLEX_PLAN[settings.warmupMode==='long' ? 'long' : 'short'];
  const byCat = cat => WARMUP_LIB.filter(w=>w.cat===cat);
  const warmup =
      plan.raise      * (avgVal(byCat('raise')) + FLEX_REST.warmup)
    + plan.mobilise   * (avgVal([...byCat('mobilise'), ...byCat('activate')]) + FLEX_REST.warmup)
    + plan.potentiate * (avgVal(byCat('potentiate')) + FLEX_REST.warmup);
  const stretch = plan.stretches * (avgVal(STRETCH_LIB) + FLEX_REST.stretch);
  return Math.round(warmup + stretch);
}
/* Durée de la séance elle-même, hors échauffement/étirements. */
function sessionSeconds(session){
  const lastRest = session.exos.length ? session.exos[session.exos.length-1].rest : 0;
  const total = session.exos.reduce((a,e)=>{
    const work = e.type==='time' ? e.val : e.val*2.5; // estimation ~2,5 s par répétition
    return a + e.sets*(work+e.rest);
  }, 0);
  return Math.max(0, total - lastRest);
}

function allExoLibrary(){ return EXO_LIB.concat(customExos); }
function hasEquipment(exo){ return !exo.equip || !!equipment[exo.equip]; }
function availableExoLibrary(){ return allExoLibrary().filter(e=>hasEquipment(e) && !isLungeBlocked(e)); }

/* Index id -> entrée, reconstruit uniquement quand les exercices perso changent.
   Couvre aussi l'échauffement et les étirements pour que leurs fiches conseils
   s'ouvrent exactement comme celles des exercices. */
let exoIndex = null;
function invalidateExoIndex(){ exoIndex = null; }
function getExoById(id){
  if(!id) return undefined;
  if(!exoIndex){
    exoIndex = new Map();
    [...allExoLibrary(), ...WARMUP_LIB, ...STRETCH_LIB].forEach(e=>exoIndex.set(e.id, e));
  }
  return exoIndex.get(id);
}
function getTipsFor(id){ const e = getExoById(id); return (e && e.tips && e.tips.length) ? e.tips : GENERIC_TIPS; }
function getSessionMuscles(session){
  const seen = [];
  session.exos.forEach(e=>{
    const libExo = getExoById(e.libId);
    (libExo && libExo.muscles ? libExo.muscles : []).forEach(m=>{ if(!seen.includes(m)) seen.push(m); });
  });
  return seen;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------------- AUDIO ----------------
 * Plusieurs sonorités au choix : dans une salle partagée, deux minuteurs qui
 * font le même bip prêtent à confusion. Chaque profil transpose les
 * fréquences et change le timbre, ce qui rend les bips franchement
 * distinguables sans toucher aux appels existants. */
const SOUND_PROFILES = {
  // `gain` compense le volume perçu : une onde carrée sonne bien plus fort
  // qu'une sinusoïde à amplitude égale.
  classic: {label:'🔔 Classique', ratio:1,    wave:'sine',     gain:1},
  low:     {label:'🥁 Grave',     ratio:0.5,  wave:'sine',     gain:1.15},
  high:    {label:'✨ Aigu',      ratio:1.6,  wave:'sine',     gain:0.9},
  soft:    {label:'🎵 Doux',      ratio:0.75, wave:'triangle', gain:0.95},
  sharp:   {label:'📟 Net',       ratio:1.2,  wave:'square',   gain:0.45},
};
function soundProfile(){ return SOUND_PROFILES[settings.soundProfile] || SOUND_PROFILES.classic; }
let actx = null;
function beep(freq, dur, vol){
  if(!settings.sound) return;
  playTone(freq, dur, vol);
}
/* Joue un son en ignorant le réglage "Son" : sert à faire écouter un profil
   pendant qu'on le choisit. */
function playTone(freq, dur, vol){
  const profile = soundProfile();
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = profile.wave;
    o.frequency.value = freq * profile.ratio;
    g.gain.value = (vol!=null?vol:0.15) * (profile.gain!=null?profile.gain:1);
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur/1000);
    o.stop(actx.currentTime + dur/1000 + 0.02);
  }catch(e){}
}
function webVibrate(pattern){
  try{
    if(!navigator.vibrate) return Promise.reject(new Error('non supportée par le système'));
    return navigator.vibrate(pattern) ? Promise.resolve() : Promise.reject(new Error('refusée par le système'));
  }catch(e){ return Promise.reject(e); }
}
/* Joue un motif [vibre, pause, vibre, ...] et renvoie une promesse qui échoue
   si rien n'a pu être déclenché, pour pouvoir le dire à l'utilisateur plutôt
   que d'échouer en silence.
   Un chrono (setInterval) n'est pas un "geste utilisateur" : la Vibration API
   web est alors ignorée sans erreur (règle du navigateur, valable aussi dans
   la WebView Android), or une bonne partie des vibrations de l'app partent du
   minuteur. D'où le module natif Haptics, avec repli sur l'API web s'il manque
   (ancienne version installée). */
function playVibration(pattern){
  const seq = Array.isArray(pattern) ? pattern : [pattern];
  if(!isNativeApp()) return webVibrate(pattern);
  let at = 0, first = null;
  seq.forEach((ms, i)=>{
    if(i % 2 === 0){
      if(first === null){ first = callNativePlugin('Haptics', 'vibrate', {duration: ms}); }
      else { const delay = at; setTimeout(()=>{ callNativePlugin('Haptics', 'vibrate', {duration: ms}).catch(()=>{}); }, delay); }
    }
    at += ms;
  });
  return (first || Promise.resolve()).catch(err=> webVibrate(pattern).catch(()=>{ throw err; }));
}
function vibrate(pattern){
  if(!settings.vibrate) return;
  playVibration(pattern).catch(()=>{});
}

/* ---------------- RENDER ROOT ---------------- */
/* Ferme la feuille courante et relance le chrono s'il avait été mis en pause
   uniquement pour lire les conseils. */
/* Délai avant de relancer le chrono en sortant des conseils : le temps de
   reposer le téléphone et de se remettre en position. */
const RESUME_DELAY_SEC = 3;
function cancelResumeCountdown(){
  if(!player) return;
  if(player.resumeTimerId){ clearInterval(player.resumeTimerId); player.resumeTimerId = null; }
  player.resumeIn = null;
}
function startResumeCountdown(){
  cancelResumeCountdown();
  player.resumeIn = RESUME_DELAY_SEC;
  player.resumeEndAt = Date.now() + RESUME_DELAY_SEC*1000;
  player.resumeTimerId = setInterval(tickResume, 150);
  render();
}
function tickResume(){
  if(!player || player.resumeIn == null){ return; }
  const remainingMs = player.resumeEndAt - Date.now();
  if(remainingMs <= 0){
    cancelResumeCountdown();
    resumePlayer();
    return;
  }
  const remaining = Math.max(1, Math.ceil(remainingMs/1000));
  if(remaining !== player.resumeIn){
    player.resumeIn = remaining;
    beep(700, 90, 0.1);
    render();
  }
}
function closeSheet(){
  if(sheet && sheet.type === 'update') stopDownloadWatch();
  const resume = !!(sheet && sheet.resumeOnClose);
  sheet = null;
  if(resume) startResumeCountdown(); else render();
}
function render(){
  try{
    renderInner();
  }catch(err){
    renderCrash(err);
  }
}
function renderInner(){
  const app = document.getElementById('app');
  let html = '';
  if(view === 'player' && player){
    html = renderPlayer();
  } else {
    html = renderHeader() + (
      view === 'home' ? renderHome() :
      view === 'builder' ? renderBuilder() :
      view === 'library' ? renderLibrary() :
      view === 'tracking' ? renderTracking() : ''
    );
  }
  app.innerHTML = html + renderSheet();
  attachEvents();
}
/* Filet de sécurité : si des données corrompues (import invalide, stockage
   altéré à la main) font planter le rendu normal, on évite un écran blanc
   bloqué en proposant de réinitialiser les données de l'app. */
function renderCrash(err){
  console.error(err);
  const app = document.getElementById('app');
  app.innerHTML = `<div class="empty" style="padding-top:60px;">
    <div class="big">⚠️</div>
    <h3>Un problème est survenu</h3>
    <p>L'application n'a pas pu afficher tes données correctement (données corrompues ou import invalide).</p>
    <button class="btn danger block" id="resetAppDataBtn" style="margin-top:16px;">Réinitialiser les données de l'application</button>
  </div>`;
  const btn = document.getElementById('resetAppDataBtn');
  if(btn) btn.onclick = ()=>{
    if(confirm('Cela supprimera toutes tes séances, exercices personnalisés, réglages et suivi de cette appli. Continuer ?')){
      [LS_SESSIONS, LS_CUSTOM, LS_SETTINGS, LS_EQUIPMENT, LS_LOGS].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
      location.reload();
    }
  };
}

/* ---------------- HOME ---------------- */
function renderHome(){
  const newBtn = `<button class="btn primary block" data-action="newSession" style="margin-bottom:16px;">+ Nouvelle séance</button>`;
  if(sessions.length===0){
    return newBtn + `<div class="empty"><div class="big">🧘</div><h3>Aucune séance</h3><p>Crée ta première séance avec le bouton ci-dessus.</p></div>`;
  }
  const flexSec = estimateFlexSeconds();
  return newBtn + sessions.map((s,i)=>{
    const totalSets = s.exos.reduce((a,e)=>a+e.sets,0);
    const workSec = sessionSeconds(s);
    const estMin = Math.round((workSec + flexSec)/60);
    const flexMin = Math.round(flexSec/60);
    const muscles = getSessionMuscles(s);
    return `
    <div class="card">
      <h2>${escapeHtml(s.name)}</h2>
      <p>${s.exos.length} exercices · ${totalSets} séries · ~${estMin} min${flexMin > 0 ? ` <span style="opacity:.8;">(dont ~${flexMin} min d'échauffement + étirements)</span>` : ''}</p>

/* ---------------- LIBRARY ---------------- */
const LIB_TABS = { warmup:'🔥 Échauffement', exos:'💪 Exercices', stretch:'🧘 Étirements' };

/* Une carte de bibliothèque, commune aux trois onglets. `note` décrit la ligne
   de détail propre à chaque type (défaut d'un exercice, durée d'un étirement…). */
function renderLibCard(e, note){
  const equipLocked = e.equip && !equipment[e.equip];
  const lungeLocked = isLungeBlocked(e);
  const locked = equipLocked || lungeLocked;
  const lockNote = equipLocked ? ` · 🔒 ${EQUIPMENT_LABELS[e.equip]}` : (lungeLocked ? ` · 🦵 Désactivé (genoux)` : '');
  const lockIcon = equipLocked ? '🔒' : (lungeLocked ? '🦵' : '💡');
  const musclesNote = (e.muscles&&e.muscles.length) ? `<small style="display:block;color:var(--muted);">🎯 ${e.muscles.map(m=>escapeHtml(m)).join(' · ')}</small>` : '';
  return `<div class="card tight lib-item" style="margin-bottom:8px;${locked?'opacity:.5;':''}" data-tips="${e.id}">
    <span class="emoji">${e.icon}</span>
    <div style="flex:1;">
      <b>${escapeHtml(e.name)}</b>
      <small>${note}${lockNote}</small>
      ${musclesNote}
    </div>
    <span class="pill">${lockIcon}</span>
    ${e.custom? `<button class="icon-btn" data-del-custom="${e.id}" title="Supprimer" aria-label="Supprimer cet exercice personnalisé">🗑️</button>` : ''}
  </div>`;
}
function renderLibSection(entries, catLabels, noteFor){
  const cats = {};
  entries.forEach(e=>{ (cats[e.cat]=cats[e.cat]||[]).push(e); });
  return Object.keys(cats).map(cat=>
    `<div class="cat-title">${escapeHtml(catLabels ? catLabels[cat] : cat)}</div>` +
    cats[cat].map(e=>renderLibCard(e, noteFor(e))).join('')
  ).join('');
}
function renderSearchField(id, value, placeholder){
  return `<div class="search-field">
    <span class="search-icon">🔎</span>
    <input type="text" id="${id}" value="${escapeHtml(value)}" placeholder="${escapeHtml(placeholder)}" autocomplete="off" autocorrect="off" spellcheck="false">
    ${value ? `<button class="search-clear" data-clear-search="${id}" title="Effacer" aria-label="Effacer la recherche">✕</button>` : ''}
  </div>`;
}
function renderNoMatch(query){
  return `<div class="empty" style="padding:28px 10px;"><div class="big">🔎</div><p>Aucun exercice ne correspond à « ${escapeHtml(query)} ».</p></div>`;
}
function renderLibrary(){
  const tabs = `<nav class="tabs" style="margin:0 0 14px;">${
    Object.keys(LIB_TABS).map(k=>`<button data-libtab="${k}" class="${libTab===k?'active':''}">${LIB_TABS[k]}</button>`).join('')
  }</nav>`;
  const search = renderSearchField('libSearch', libSearch, 'Rechercher un exercice ou un muscle…');
  const filter = list => list.filter(e=>matchesSearch(e, libSearch));

  if(libTab==='warmup'){
    const list = filter(WARMUP_LIB);
    return tabs + search + `<p style="margin:0 0 12px;">Mouvements dynamiques à faire avant l'effort. L'app en sélectionne automatiquement selon les muscles de ta séance — tu peux aussi les consulter ici.</p>`
      + (list.length ? renderLibSection(list, WARMUP_CATS, e=>`${e.val}s · dynamique`) : renderNoMatch(libSearch));
  }
  if(libTab==='stretch'){
    const list = filter(STRETCH_LIB);
    return tabs + search + `<p style="margin:0 0 12px;">Étirements statiques de fin de séance : garde chaque position sans à-coups, jusqu'à la sensation d'étirement, jamais à la douleur.</p>`
      + (list.length ? renderLibSection(list, STRETCH_CATS, e=>`${e.val}s de maintien`) : renderNoMatch(libSearch));
  }
  const list = filter(allExoLibrary());
  return tabs + search
    + `<button class="btn ghost block" data-action="openEquipment" style="margin-bottom:10px;">🎒 Gérer mon équipement</button>
       <button class="btn accent block" data-action="openCustomExo" style="margin-bottom:14px;">+ Créer un exercice personnalisé</button>`
    + (list.length ? renderLibSection(list, null, e=>{
        const levelNote = e.level ? ` · ${escapeHtml(e.level)}` : '';
        const bandNote = e.bandTip ? ' · 🎗️ élastique en option' : '';
        return `${e.type==='time'?'Basé sur le temps':'Basé sur les répétitions'} · défaut ${e.sets}×${e.val}${e.type==='time'?'s':''}${levelNote}${bandNote}`;
      }) : renderNoMatch(libSearch));
}

/* ---------------- TRACKING ---------------- */
function formatLogDate(iso){
  try{
    const d = new Date(iso);
    const weekday = d.toLocaleDateString('fr-FR', {weekday:'long'});
    const dateStr = d.toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});
    const timeStr = d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
    const cap = weekday.charAt(0).toUpperCase() + weekday.slice(1);
    return `${cap} ${dateStr} à ${timeStr}`;
  }catch(e){ return iso; }
}
function renderTracking(){
  if(logs.length===0){
    return `<div class="empty"><div class="big">📊</div><h3>Aucune séance enregistrée</h3><p>Termine une séance pour voir apparaître ton suivi ici.</p></div>`;
  }
  const rows = logs.slice().reverse().map((log,idx)=>{
    const realIdx = logs.length-1-idx;
    const exoRows = log.exercises.map(ex=>{
      const unit = ex.type==='time' ? 's' : '';
      const plannedStr = `${ex.plannedSets}×${ex.plannedVal}${unit}`;
      let statusHtml;
      if(Array.isArray(ex.reps) && ex.reps.length){
        // Détail série par série
        const detail = ex.reps.map(r=>r+unit).join(' · ');
        statusHtml = `<span class="pill" style="color:${ex.completed?'var(--accent2)':'var(--accent)'};">${ex.completed?'✓ ':''}${escapeHtml(detail)} <span style="color:var(--muted);">(obj. ${plannedStr})</span></span>`;
      } else if(ex.completed){
        statusHtml = `<span class="pill" style="color:var(--accent2);">✓ ${plannedStr}</span>`;
      } else {
        // Ancien format (séances enregistrées avant le suivi série par série)
        const done = `${ex.actualSets!=null?ex.actualSets:'?'}×${ex.actualVal!=null?ex.actualVal:'?'}${unit}`;
        statusHtml = `<span class="pill" style="color:var(--accent);">${escapeHtml(done)} <span style="color:var(--muted);">(obj. ${plannedStr})</span></span>`;
      }
      return `<div class="row between wrap" style="font-size:13px;padding:6px 0;border-bottom:1px solid var(--border);gap:6px;">
        <span>${ex.icon} ${escapeHtml(ex.name)}</span>
        ${statusHtml}
      </div>`;
    }).join('');
    return `<div class="card">
      <div class="row between">
        <div>
          <h2>${escapeHtml(log.sessionName)}</h2>
          <p>${formatLogDate(log.dateISO)}</p>
        </div>
        <button class="icon-btn" data-del-log="${realIdx}" title="Supprimer">🗑️</button>
      </div>
      <div style="margin-top:8px;">${exoRows}</div>
      ${log.feeling || log.note ? `<div style="margin-top:10px;">
        ${log.feeling && FEELING_LABELS[log.feeling] ? `<span class="pill">${FEELING_LABELS[log.feeling]}</span>` : ''}
        ${log.note ? `<p style="margin-top:8px;color:var(--text);font-size:13px;white-space:pre-wrap;">📝 ${escapeHtml(log.note)}</p>` : ''}
      </div>` : ''}
    </div>`;
  }).join('');
  return rows + `<button class="btn ghost block" data-action="clearLogs" style="margin-top:6px;">🗑️ Effacer tout l'historique</button>`;
}
