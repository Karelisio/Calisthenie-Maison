<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calisthénie Maison</title>
<style>
  :root{
    --bg:#0f1115;
    --bg2:#161a22;
    --card:#1c212b;
    --card2:#232a37;
    --border:#2b3242;
    --text:#eef1f6;
    --muted:#8b93a7;
    --accent:#ff7a45;
    --accent2:#22c3a6;
    --danger:#ff5566;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(900px 520px at 108% 115%, rgba(255,122,69,.10), transparent 60%),
      radial-gradient(700px 480px at -8% -8%, rgba(34,195,166,.09), transparent 60%),
      radial-gradient(1200px 800px at 20% -10%, #1a2130 0%, var(--bg) 55%);
    background-color:var(--bg);
    background-attachment:fixed;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:640px;margin:0 auto;padding:20px 16px 100px;}
  h1,h2,h3{margin:0 0 4px;}
  h1{font-size:22px;}
  h2{font-size:18px;}
  p{margin:4px 0;color:var(--muted);font-size:14px;}
  .row{display:flex;align-items:center;gap:10px;}
  .between{justify-content:space-between;}
  .wrap{flex-wrap:wrap;}
  .header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, var(--bg) 70%, transparent);
    padding:16px 16px 8px;margin:-20px -16px 16px;
    backdrop-filter:blur(6px);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .logo{
    width:38px;height:38px;border-radius:12px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;font-size:20px;
  }
  nav.tabs{display:flex;gap:6px;margin-top:14px;}
  nav.tabs button{
    flex:1;background:var(--card);border:1px solid var(--border);color:var(--muted);
    padding:10px 4px;border-radius:12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  nav.tabs button.active{background:linear-gradient(135deg,var(--accent),#ff9a6a);color:#1a0d05;border-color:transparent;box-shadow:0 8px 20px -10px rgba(255,122,69,.5), 0 1px 0 rgba(255,255,255,.3) inset;}

  .card{
    position:relative;isolation:isolate;overflow:hidden;
    background:linear-gradient(160deg, var(--card2) 0%, var(--card) 55%);
    border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 14px 30px -20px rgba(0,0,0,.7);
  }
  .card::before{
    content:'';position:absolute;inset:0;z-index:-1;
    background:linear-gradient(180deg, rgba(255,255,255,.05), transparent 50%);
    pointer-events:none;
  }
  .card.tight{padding:12px 14px;}
  .card:active{transform:scale(0.997);}

  button{font-family:inherit;}
  .btn{
    position:relative;overflow:hidden;isolation:isolate;
    border:none;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:600;
    cursor:pointer;color:#fff;background:var(--card2);border:1px solid var(--border);
    box-shadow:0 1px 0 rgba(255,255,255,.06) inset;
    transition:transform .15s ease, filter .15s ease;
  }
  .btn::before{
    content:'';position:absolute;inset:0;z-index:-1;
    background:linear-gradient(180deg, rgba(255,255,255,.22), transparent 55%);
    opacity:0;transition:opacity .15s ease;pointer-events:none;
  }
  .btn.primary::before, .btn.accent::before{opacity:1;}
  .btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.05);}
  .btn:active:not(:disabled){transform:translateY(0);filter:brightness(.97);}
  .btn.primary{background:linear-gradient(135deg,var(--accent),#ff9a6a);color:#1a0d05;border:none;box-shadow:0 10px 24px -12px rgba(255,122,69,.5);}
  .btn.accent{background:linear-gradient(135deg,var(--accent2),#5be0c9);color:#04241d;border:none;box-shadow:0 10px 24px -12px rgba(34,195,166,.5);}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn.danger{background:rgba(255,85,102,.12);color:var(--danger);border:1px solid rgba(255,85,102,.3);}
  .btn.block{width:100%;}
  .btn.sm{padding:8px 10px;font-size:12px;border-radius:10px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .icon-btn{
    width:38px;height:38px;border-radius:10px;background:linear-gradient(160deg, var(--card2), var(--card));border:1px solid var(--border);
    color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;
    box-shadow:0 1px 0 rgba(255,255,255,.07) inset;transition:transform .15s ease, filter .15s ease;
  }
  .icon-btn:hover{transform:translateY(-1px);filter:brightness(1.1);}

  .pill{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(160deg, var(--card2), var(--card));border:1px solid var(--border);
    padding:4px 10px;border-radius:999px;font-size:12px;color:var(--muted);box-shadow:0 1px 0 rgba(255,255,255,.06) inset;}
  .badge{background:rgba(255,122,69,.15);color:var(--accent);padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;}

  input[type=text], input[type=number], select{
    width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--text);
    padding:10px 12px;border-radius:10px;font-size:14px;
  }
  label.field{display:block;margin-bottom:10px;}
  label.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}

  .exo-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;background:linear-gradient(160deg, var(--card2), var(--bg2));border:1px solid var(--border);margin-bottom:8px;box-shadow:0 1px 0 rgba(255,255,255,.05) inset;}
  .exo-item .emoji{font-size:22px;width:34px;text-align:center;}
  .exo-item .meta{flex:1;min-width:0;}
  .exo-item .meta b{display:block;font-size:14px;}
  .exo-item .meta small{color:var(--muted);}
  .stepper{display:flex;align-items:center;gap:6px;}
  .stepper button{width:26px;height:26px;border-radius:8px;background:var(--card2);border:1px solid var(--border);color:var(--text);cursor:pointer;}
  .stepper span{min-width:26px;text-align:center;font-size:13px;font-weight:700;}
  .stepper-col{display:flex;flex-direction:column;align-items:flex-start;gap:4px;}
  .stepper-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}

  .empty{text-align:center;padding:40px 10px;color:var(--muted);}
  .empty .big{font-size:40px;margin-bottom:8px;}

  /* Player */
  .player{text-align:center;}
  .progress-outer{height:6px;background:var(--card2);border-radius:999px;overflow:hidden;margin-bottom:18px;box-shadow:0 1px 0 rgba(255,255,255,.05) inset;}
  .progress-inner{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s;box-shadow:0 0 12px rgba(255,122,69,.5);}
  .phase-tag{display:inline-block;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.5px;margin-bottom:10px;}
  .phase-tag.work{background:linear-gradient(160deg, rgba(255,122,69,.15), transparent);color:var(--accent);box-shadow:0 0 18px -6px rgba(255,122,69,.55), 0 0 0 1px rgba(255,122,69,.2) inset;}
  .phase-tag.rest{background:linear-gradient(160deg, rgba(34,195,166,.15), transparent);color:var(--accent2);box-shadow:0 0 18px -6px rgba(34,195,166,.55), 0 0 0 1px rgba(34,195,166,.2) inset;}
  .phase-tag.done{background:rgba(255,255,255,.1);color:var(--text);}
  .exo-name{font-size:24px;font-weight:800;margin:6px 0 2px;}
  .set-count{color:var(--muted);font-size:14px;margin-bottom:18px;}
  .big-emoji{font-size:56px;margin:6px 0;}
  .timer{font-size:76px;font-weight:800;font-variant-numeric:tabular-nums;margin:6px 0 14px;letter-spacing:1px;}
  .timer.glow-work{text-shadow:0 0 34px rgba(255,122,69,.4);}
  .timer.glow-rest{text-shadow:0 0 34px rgba(34,195,166,.4);}
  .reps-target{font-size:56px;font-weight:800;margin:6px 0 14px;color:var(--accent);text-shadow:0 0 30px rgba(255,122,69,.3);}
  .reps-target span{font-size:22px;color:var(--muted);font-weight:600;}
  .controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
  .controls .btn{min-width:90px;}
  .rest-adjust{display:flex;justify-content:center;gap:10px;margin:10px 0;}
  .next-preview{margin-top:18px;color:var(--muted);font-size:13px;}
  .next-preview b{color:var(--text);}

  footer.tabbar{
    position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,21,.9);backdrop-filter:blur(8px);
    border-top:1px solid var(--border);padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    display:flex;justify-content:center;
  }
  .toast{
    position:fixed;left:50%;bottom:90px;transform:translateX(-50%);
    background:var(--card2);border:1px solid var(--border);padding:10px 16px;border-radius:12px;font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .toast.show{opacity:1;}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
  .sheet{background:linear-gradient(180deg, var(--card2), var(--bg2) 40%);border:1px solid var(--border);border-top:1px solid rgba(255,255,255,.08);border-radius:20px 20px 0 0;padding:18px 16px 26px;width:100%;max-width:640px;max-height:85vh;overflow-y:auto;box-shadow:0 -20px 50px -20px rgba(0,0,0,.6);}
  .sheet h3{margin-bottom:14px;}
  .cat-title{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 0 8px;}
  .lib-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;cursor:pointer;}
  .lib-item:active{background:var(--card2);}
  .lib-item .emoji{font-size:22px;width:32px;text-align:center;}
  .lib-item b{font-size:14px;display:block;}
  .lib-item small{color:var(--muted);}

  .tips-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px;}
  .tips-list li{padding-left:24px;position:relative;font-size:14px;line-height:1.55;color:var(--text);}
  .tips-list li:before{content:'✓';position:absolute;left:0;top:0;color:var(--accent2);font-weight:700;}
  .tips-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(34,195,166,.15);color:var(--accent2);border:1px solid transparent;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:16px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
(function(){

/* ---------------- DATA ---------------- */
const EXO_LIB = [
 {id:'pushup', name:'Pompes', cat:'Haut du corps – Push', icon:'💪', type:'reps', sets:3, val:12, rest:60, muscles:['Pectoraux','Triceps','Épaules'], tips:[

 {id:'pushup_incline', name:'Pompes mains surélevées', cat:'Haut du corps – Push', icon:'🔼', type:'reps', sets:3, val:15, rest:45, muscles:['Pectoraux','Triceps','Épaules'], tips:[

 {id:'table_row', name:'Tirage sous table (Rowing)', cat:'Haut du corps – Pull', icon:'🚣', type:'reps', sets:3, val:12, rest:60, muscles:['Dos','Biceps','Avant-bras'], tips:[

 {id:'ytw_raise', name:'Y-T-W (dos & épaules)', cat:'Haut du corps – Pull', icon:'🦅', type:'reps', sets:3, val:10, rest:45, muscles:['Trapèzes','Dos','Épaules'], tips:[

 {id:'towel_row_door', name:'Tirage horizontal (serviette + porte)', cat:'Haut du corps – Pull', icon:'🚪', type:'reps', sets:3, val:12, rest:60, muscles:['Dos','Biceps','Avant-bras'], tips:[

 {id:'lunge', name:'Fentes avant', cat:'Bas du corps', icon:'🦿', type:'reps', sets:3, val:12, rest:45, level:'Intermédiaire', bandTip:"Place l'élastique juste au-dessus des genoux pour un travail supplémentaire de stabilité des hanches à chaque pas.", muscles:['Quadriceps','Fessiers','Ischio-jambiers'], tips:[

 {id:'glute_bridge', name:'Pont fessier', cat:'Bas du corps', icon:'🌉', type:'reps', sets:3, val:15, rest:30, level:'Débutant', bandTip:"Place l'élastique juste au-dessus des genoux pour augmenter l'activation des fessiers moyens en plus des grands fessiers.", muscles:['Fessiers','Ischio-jambiers','Lombaires'], tips:[

 {id:'calf_raise', name:'Montées sur pointes', cat:'Bas du corps', icon:'🩰', type:'reps', sets:3, val:20, rest:30, muscles:['Mollets'], tips:[

 {id:'wall_sit', name:'Chaise (Wall sit)', cat:'Bas du corps', icon:'🪑', type:'time', sets:3, val:45, rest:45, muscles:['Quadriceps'], tips:[

 {id:'hip_abduction', name:'Abduction hanche', cat:'Bas du corps', icon:'🦩', type:'reps', sets:3, val:15, rest:30, level:'Débutant', bandTip:"Ajoute l'élastique au-dessus des genoux ou autour des chevilles pour plus de résistance sur tout le mouvement.", muscles:['Fessiers (moyen)','Hanches'], tips:[

const LS_CUSTOM = 'cal_custom_exos_v1';
const LS_SETTINGS = 'cal_settings_v1';
const LS_EQUIPMENT = 'cal_equipment_v1';
const LS_LOGS = 'cal_logs_v1';

function loadSessions(){
  try{
    const raw = localStorage.getItem(LS_SESSIONS);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const d = defaultSessions();
  saveSessions(d);
  return d;
}
function saveSessions(s){ try{ localStorage.setItem(LS_SESSIONS, JSON.stringify(s)); }catch(e){} }
function loadCustomExos(){ try{ return JSON.parse(localStorage.getItem(LS_CUSTOM)||'[]'); }catch(e){ return []; } }

function loadSettings(){ try{ return Object.assign({sound:true, vibrate:true}, JSON.parse(localStorage.getItem(LS_SETTINGS)||'{}')); }catch(e){ return {sound:true, vibrate:true}; } }
function saveSettings(s){ try{ localStorage.setItem(LS_SETTINGS, JSON.stringify(s)); }catch(e){} }
function loadEquipment(){ try{ return Object.assign({pullupBar:false, dipBar:false, chair:false, bench:false, bands:false}, JSON.parse(localStorage.getItem(LS_EQUIPMENT)||'{}')); }catch(e){ return {pullupBar:false, dipBar:false, chair:false, bench:false, bands:false}; } }

function allExoLibrary(){ return EXO_LIB.concat(customExos); }
function hasEquipment(exo){ return !exo.equip || !!equipment[exo.equip]; }
function availableExoLibrary(){ return allExoLibrary().filter(hasEquipment); }
function getExoById(id){ return allExoLibrary().find(x=>x.id===id); }
function getTipsFor(id){ const e = getExoById(id); return (e && e.tips && e.tips.length) ? e.tips : GENERIC_TIPS; }
function getSessionMuscles(session){
  const seen = [];
  session.exos.forEach(e=>{
    const libExo = getExoById(e.libId);
    (libExo && libExo.muscles ? libExo.muscles : []).forEach(m=>{ if(!seen.includes(m)) seen.push(m); });
  });
  return seen;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------------- AUDIO ---------------- */
let actx = null;
function beep(freq, dur, vol){
  if(!settings.sound) return;
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'sine';
    o.frequency.value = freq;
    g.gain.value = (vol!=null?vol:0.15);
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur/1000);
    o.stop(actx.currentTime + dur/1000 + 0.02);
  }catch(e){}
}
function vibrate(pattern){
  if(!settings.vibrate) return;
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}

function render(){
  const app = document.getElementById('app');
  let html = '';
  if(view === 'player' && player){
    html = renderPlayer();
  } else {
    html = renderHeader() + (
      view === 'home' ? renderHome() :
      view === 'builder' ? renderBuilder() :
      view === 'library' ? renderLibrary() :
      view === 'tracking' ? renderTracking() : ''
    );
  }
  app.innerHTML = html + renderSheet();
  attachEvents();
}

function renderHome(){
  const newBtn = `<button class="btn primary block" data-action="newSession" style="margin-bottom:16px;">+ Nouvelle séance</button>`;
  if(sessions.length===0){
    return newBtn + `<div class="empty"><div class="big">🧘</div><h3>Aucune séance</h3><p>Crée ta première séance avec le bouton ci-dessus.</p></div>`;
  }
  return newBtn + sessions.map((s,i)=>{
    const totalSets = s.exos.reduce((a,e)=>a+e.sets,0);
    const estMin = Math.round(Math.max(0, s.exos.reduce((a,e)=>{
      const work = e.type==='time' ? e.val : e.val*2.5; // estimate ~2.5s per rep
      return a + e.sets*(work+e.rest);
    },0) - s.exos[s.exos.length-1].rest)/60);
    const muscles = getSessionMuscles(s);
    return `
    <div class="card">
      <div class="row between">
        <div>
          <h2>${escapeHtml(s.name)}</h2>
          <p>${s.exos.length} exercices · ${totalSets} séries · ~${estMin} min</p>
        </div>
        <div class="row">
          <button class="icon-btn" data-edit-session="${i}" title="Modifier">✏️</button>
          <button class="icon-btn" data-del-session="${i}" title="Supprimer">🗑️</button>
        </div>
      </div>
      <div class="row wrap" style="margin-top:10px;">
        ${s.exos.slice(0,5).map(e=>`<span class="pill">${e.icon} ${escapeHtml(e.name)}</span>`).join('')}
        ${s.exos.length>5?`<span class="pill">+${s.exos.length-5}</span>`:''}
      </div>
      ${muscles.length ? `<p style="margin-top:8px;font-size:12px;">🎯 <b style="color:var(--text);font-weight:600;">Muscles travaillés :</b> ${muscles.map(m=>escapeHtml(m)).join(', ')}</p>` : ''}
      <button class="btn primary block" style="margin-top:12px;" data-start-session="${i}">▶ Démarrer</button>
    </div>`;
  }).join('') + `
  <div class="card tight" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
    <span style="font-size:13px;color:var(--muted);">Réglages</span>
    <div class="row wrap">
      <button class="btn sm ${settings.sound?'accent':'ghost'}" data-toggle="sound">🔊 Son ${settings.sound?'ON':'OFF'}</button>
      <button class="btn sm ${settings.vibrate?'accent':'ghost'}" data-toggle="vibrate">📳 Vibration ${settings.vibrate?'ON':'OFF'}</button>
      <button class="btn sm ghost" data-action="openEquipment">🎒 Équipement</button>
      <button class="btn sm ghost" data-action="openExport">📤 Export</button>
      <button class="btn sm ghost" data-action="openImport">📥 Import</button>
    </div>
  </div>`;
}

      const musclesNote = (e.muscles&&e.muscles.length) ? `<small style="display:block;color:var(--muted);">🎯 ${e.muscles.map(m=>escapeHtml(m)).join(' · ')}</small>` : '';
      html += `<div class="card tight lib-item" style="margin-bottom:8px;${locked?'opacity:.5;':''}" data-tips="${e.id}">
        <span class="emoji">${e.icon}</span>
        <div style="flex:1;">
          <b>${escapeHtml(e.name)}</b>
          <small>${e.type==='time'?'Basé sur le temps':'Basé sur les répétitions'} · défaut ${e.sets}×${e.val}${e.type==='time'?'s':''}${levelNote}${bandNote}${locked?` · 🔒 ${EQUIPMENT_LABELS[e.equip]}`:''}</small>
          ${musclesNote}
        </div>
        <span class="pill">${locked?'🔒':'💡'}</span>
        ${e.custom? `<button class="icon-btn" data-del-custom="${e.id}">🗑️</button>` : ''}
      </div>`;
    });
  });
  return html;
}

/* ---------------- TRACKING ---------------- */
function formatLogDate(iso){
  try{
    const d = new Date(iso);
    const weekday = d.toLocaleDateString('fr-FR', {weekday:'long'});
    const dateStr = d.toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});
    const timeStr = d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
    const cap = weekday.charAt(0).toUpperCase() + weekday.slice(1);
    return `${cap} ${dateStr} à ${timeStr}`;
  }catch(e){ return iso; }
}
function renderTracking(){
  if(logs.length===0){
    return `<div class="empty"><div class="big">📊</div><h3>Aucune séance enregistrée</h3><p>Termine une séance pour voir apparaître ton suivi ici.</p></div>`;
  }
  const rows = logs.slice().reverse().map((log,idx)=>{
    const realIdx = logs.length-1-idx;
    const exoRows = log.exercises.map(ex=>{
      const unit = ex.type==='time' ? 's' : '';
      const plannedStr = `${ex.plannedSets}×${ex.plannedVal}${unit}`;
      const statusHtml = ex.completed
        ? `<span class="pill" style="color:var(--accent2);">✓ ${plannedStr}</span>`
        : `<span class="pill" style="color:var(--accent);">${ex.actualSets}×${ex.actualVal}${unit} <span style="color:var(--muted);">(obj. ${plannedStr})</span></span>`;
      return `<div class="row between" style="font-size:13px;padding:6px 0;border-bottom:1px solid var(--border);">
        <span>${ex.icon} ${escapeHtml(ex.name)}</span>
        ${statusHtml}
      </div>`;
    }).join('');
    return `<div class="card">
      <div class="row between">
        <div>
          <h2>${escapeHtml(log.sessionName)}</h2>
          <p>${formatLogDate(log.dateISO)}</p>
        </div>
        <button class="icon-btn" data-del-log="${realIdx}" title="Supprimer">🗑️</button>
      </div>
      <div style="margin-top:8px;">${exoRows}</div>
    </div>`;
  }).join('');
  return rows + `<button class="btn ghost block" data-action="clearLogs" style="margin-top:6px;">🗑️ Effacer tout l'historique</button>`;
}

/* ---------------- PLAYER ---------------- */
function flattenSteps(session){
  // build list of {exoIndex, setIndex, exo}
  const steps = [];
  session.exos.forEach((e,ei)=>{
    for(let s=0;s<e.sets;s++) steps.push({exoIndex:ei, setIndex:s, exo:e});
  });
  return steps;
}

function startSession(idx){
  const session = JSON.parse(JSON.stringify(sessions[idx]));
  const steps = flattenSteps(session);
  if(steps.length===0){ toast('Cette séance est vide.'); return; }
  player = {
    session, steps, stepIdx:0,
    phase:'work', // work | rest | done
    remaining: steps[0].exo.type==='time' ? steps[0].exo.val : null,
    running:false,
    endAt:null,
    intervalId:null,
    restDuration:null,
    beepedAt:{}
  };
  view = 'player';
  render();
}

function currentStep(){ return player.steps[player.stepIdx]; }

function clearTick(){
  if(player.intervalId){ clearInterval(player.intervalId); player.intervalId=null; }
}

function startCountdown(seconds){
  player.remaining = seconds;
  player.running = true;
  player.endAt = Date.now() + seconds*1000;
  player.beepedAt = {};
  clearTick();
  player.intervalId = setInterval(tick, 200);
  render();
}

function tick(){
  if(!player || !player.running) return;
  const remainingMs = player.endAt - Date.now();
  const remaining = Math.max(0, Math.ceil(remainingMs/1000));
  if(remaining !== player.remaining){
    player.remaining = remaining;
    if(remaining<=3 && remaining>0 && !player.beepedAt[remaining]){
      player.beepedAt[remaining]=true; beep(880,120,0.12);
    }
    updatePlayerDom();
  }
  if(remainingMs<=0){
    clearTick();
    player.running=false;
    beep(1200,260,0.18);
    vibrate([120,60,120]);
    advanceAfterCountdown();
  }
}

function pausePlayer(){
  if(!player.running) return;
  player.running=false;
  player.remaining = Math.max(0, Math.ceil((player.endAt-Date.now())/1000));
  clearTick();
  render();
}
function resumePlayer(){
  if(player.running) return;
  if(player.remaining==null) return;
  player.running=true;
  player.endAt = Date.now() + player.remaining*1000;
  clearTick();
  player.intervalId = setInterval(tick,200);
  render();
}
function resetPlayerPhase(){
  clearTick();
  const st = currentStep();
  if(player.phase==='work' && st.exo.type==='time'){
    startCountdown(st.exo.val);
  } else if(player.phase==='rest'){
    startCountdown(player.restDuration);
  }
}

function adjustRest(delta){
  if(player.phase!=='rest') return;
  const remainingMs = player.running ? (player.endAt-Date.now()) : player.remaining*1000;
  const newRemaining = Math.max(5, Math.round(remainingMs/1000)+delta);
  player.remaining = newRemaining;
  if(player.running){ player.endAt = Date.now()+newRemaining*1000; }
  render();
}

function completeRepsSet(){
  clearTick();
  beep(1200,220,0.18);
  vibrate(80);
  goToRestOrNext();
}

function skipCurrent(){
  clearTick();
  if(player.phase==='work'){ goToRestOrNext(); }
  else { goToNextStep(); }
}

function advanceAfterCountdown(){
  if(player.phase==='work'){ goToRestOrNext(); }
  else if(player.phase==='rest'){ goToNextStep(); }
}

function goToRestOrNext(){
  const isLastStep = player.stepIdx === player.steps.length-1;
  if(isLastStep){
    finishSession();
    return;
  }
  const st = currentStep();
  const restLen = st.exo.rest;
  player.phase = 'rest';
  player.restDuration = restLen;
  startCountdown(restLen);
}

function goToNextStep(){
  player.stepIdx++;
  if(player.stepIdx >= player.steps.length){ finishSession(); return; }
  player.phase='work';
  const st = currentStep();
  if(st.exo.type==='time'){ startCountdown(st.exo.val); }
  else { player.remaining=null; player.running=false; clearTick(); render(); }
}

function finishSession(){
  clearTick();
  player.phase='review';
  player.review = player.session.exos.map(e=>({completed:true, actualSets:e.sets, actualVal:e.val}));
  beep(660,150,0.15); setTimeout(()=>beep(880,150,0.15),160); setTimeout(()=>beep(1100,220,0.18),320);
  vibrate([100,50,100,50,150]);
  render();
}

function saveReview(){
  const s = player.session;
  const entry = {
    id: 'log_'+Date.now(),
    sessionName: s.name,
    dateISO: new Date().toISOString(),
    exercises: s.exos.map((e,i)=>{
      const ans = player.review[i];
      return {
        name:e.name, icon:e.icon, type:e.type,
        plannedSets:e.sets, plannedVal:e.val,
        completed: ans.completed,
        actualSets: ans.completed ? e.sets : Math.max(0, parseInt(ans.actualSets)||0),
        actualVal: ans.completed ? e.val : Math.max(0, parseInt(ans.actualVal)||0)
      };
    })
  };
  logs.push(entry);
  saveLogs(logs);
  exitPlayer();
  toast('Séance enregistrée dans ton suivi ✓');
}

function exitPlayer(){
  clearTick();
  player=null;
  view='home';
  render();
}

function renderReviewExo(e,i){
  const ans = player.review[i];
  const unit = e.type==='time' ? 's' : '';
  return `<div class="card tight" style="margin-bottom:10px;">
    <div class="row between">
      <b>${e.icon} ${escapeHtml(e.name)}</b>
      <span class="pill">Objectif ${e.sets}×${e.val}${unit}</span>
    </div>
    <div class="row" style="margin-top:10px;gap:8px;">
      <button class="btn sm ${ans.completed?'accent':'ghost'}" data-review-done="${i}" data-val="1">✓ Réussi</button>
      <button class="btn sm ${!ans.completed?'danger':'ghost'}" data-review-done="${i}" data-val="0">✕ Pas complet</button>
    </div>
    ${!ans.completed ? `
    <div class="row" style="margin-top:10px;gap:10px;">
      <label class="field" style="flex:1;margin-bottom:0;"><span>Séries réussies</span>
        <input type="number" min="0" data-review-field="sets" data-i="${i}" value="${ans.actualSets}">
      </label>
      <label class="field" style="flex:1;margin-bottom:0;"><span>${e.type==='time'?'Temps max (s)':'Reps max'}</span>
        <input type="number" min="0" data-review-field="val" data-i="${i}" value="${ans.actualVal}">
      </label>
    </div>` : ''}
  </div>`;
}

function renderPlayer(){
  const s = player.session;
  if(player.phase==='review'){
    return `<div class="player" style="text-align:left;padding-top:10px;">
      <div class="big-emoji" style="text-align:center;">🎉</div>
      <h1 style="text-align:center;">Séance terminée !</h1>
      <p style="text-align:center;margin-bottom:20px;">${escapeHtml(s.name)} — comment ça s'est passé ?</p>
      ${s.exos.map((e,i)=>renderReviewExo(e,i)).join('')}
      <div class="row" style="margin-top:6px;gap:10px;">
        <button class="btn ghost block" data-action="skipReview">Ignorer</button>
        <button class="btn primary block" data-action="saveReview">💾 Enregistrer dans mon suivi</button>
      </div>
    </div>`;
  }
  const st = currentStep();
  const totalSteps = player.steps.length;
  const progressPct = Math.round((player.stepIdx/totalSteps)*100);
  const nextStep = player.steps[player.stepIdx+1];
  let nextLabel = '';
  if(player.phase==='rest'){
    if(nextStep){
      const isNewExo = nextStep.exoIndex !== st.exoIndex;
      nextLabel = isNewExo ? `Prochain : <b>${nextStep.exo.icon} ${escapeHtml(nextStep.exo.name)}</b>` : `Série suivante : <b>${nextStep.exo.icon} ${escapeHtml(nextStep.exo.name)}</b>`;
    } else {
      nextLabel = `Dernière ligne droite ✨`;
    }
  }

  let centerHtml = '';
  let controlsHtml = '';

  if(player.phase==='work'){
    if(st.exo.type==='time'){
      centerHtml = `<div class="big-emoji">${st.exo.icon}</div><div class="timer glow-work">${formatTime(player.remaining)}</div>`;
      controlsHtml = `
        <div class="controls">
          ${player.running ? `<button class="btn ghost" data-action="pause">⏸ Pause</button>` : `<button class="btn primary" data-action="resume">▶ Reprendre</button>`}
          <button class="btn ghost" data-action="resetPhase">⟲ Reset</button>
          <button class="btn ghost" data-action="skip">⏭ Passer</button>
        </div>`;
    } else {
      centerHtml = `<div class="big-emoji">${st.exo.icon}</div><div class="reps-target">${st.exo.val} <span>reps</span></div>`;
      controlsHtml = `
        <div class="controls">
          <button class="btn primary" data-action="completeReps">✓ Série terminée</button>
          <button class="btn ghost" data-action="skip">⏭ Passer</button>
        </div>`;
    }
  } else if(player.phase==='rest'){
    centerHtml = `<div class="big-emoji">😮‍💨</div><div class="timer glow-rest">${formatTime(player.remaining)}</div>`;
    controlsHtml = `
      <div class="rest-adjust">
        <button class="btn ghost sm" data-action="restMinus">−15s</button>
        <button class="btn ghost sm" data-action="restPlus">+15s</button>
      </div>
      <div class="controls">
        ${player.running ? `<button class="btn ghost" data-action="pause">⏸ Pause</button>` : `<button class="btn primary" data-action="resume">▶ Reprendre</button>`}
        <button class="btn ghost" data-action="resetPhase">⟲ Reset</button>
        <button class="btn ghost" data-action="skip">⏭ Passer le repos</button>
      </div>`;
  }

  return `
  <div class="player" id="playerRoot">
    <div class="row between" style="margin-bottom:6px;">
      <button class="icon-btn" data-action="exitPlayer">✕</button>
      <span class="pill">${escapeHtml(s.name)}</span>
      <span class="pill">${player.stepIdx+1}/${totalSteps}</span>
    </div>
    <div class="progress-outer"><div class="progress-inner" style="width:${progressPct}%"></div></div>
    <span class="phase-tag ${player.phase}">${player.phase==='work'?'EN COURS':'REPOS'}</span>
    <div class="exo-name">${escapeHtml(st.exo.name)}</div>
    <div class="set-count">Série ${st.setIndex+1} / ${st.exo.sets}</div>
    <button class="tips-btn" data-tips="${st.exo.libId}">💡 Conseils &amp; sécurité</button>
    ${centerHtml}
    ${controlsHtml}
    ${nextLabel? `<div class="next-preview">${nextLabel}</div>` : ''}
  </div>`;
}

function updatePlayerDom(){
  const root = document.getElementById('playerRoot');
  if(!root) return;
  const timerEl = root.querySelector('.timer');
  if(timerEl) timerEl.textContent = formatTime(player.remaining);
  const progressEl = root.querySelector('.progress-inner');
  if(progressEl) progressEl.style.width = Math.round((player.stepIdx/player.steps.length)*100)+'%';
}

function formatTime(sec){
  sec = Math.max(0,sec|0);
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

/* ---------------- HELPERS ---------------- */
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(str){ return escapeHtml(str); }

/* ---------------- EVENTS ---------------- */
function attachEvents(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-nav]').forEach(b=>b.onclick = ()=>{
    view = b.getAttribute('data-nav');
    if(view==='builder' && !builderDraft) builderDraft = newDraft();
    render();
  });

  app.querySelectorAll('[data-toggle]').forEach(b=>b.onclick = ()=>{
    const k = b.getAttribute('data-toggle');
    settings[k] = !settings[k];
    saveSettings(settings);
    render();
  });

  app.querySelectorAll('[data-start-session]').forEach(b=>b.onclick = ()=>startSession(parseInt(b.getAttribute('data-start-session'))));
  app.querySelectorAll('[data-del-session]').forEach(b=>b.onclick = ()=>{
    const i = parseInt(b.getAttribute('data-del-session'));
    if(confirm('Supprimer la séance "'+sessions[i].name+'" ?')){
      sessions.splice(i,1); saveSessions(sessions); render();
    }
  });
  app.querySelectorAll('[data-edit-session]').forEach(b=>b.onclick = ()=>{
    const i = parseInt(b.getAttribute('data-edit-session'));
    builderDraft = JSON.parse(JSON.stringify(sessions[i]));
    builderDraft._editIndex = i;
    view='builder'; render();
  });

  // builder
  const nameInput = document.getElementById('sessionName');
  if(nameInput) nameInput.oninput = e=>{ builderDraft.name = e.target.value; };

  app.querySelectorAll('[data-stepper]').forEach(b=>b.onclick = ()=>{
    const field = b.getAttribute('data-stepper');
    const i = parseInt(b.getAttribute('data-i'));
    const d = parseInt(b.getAttribute('data-d'));
    const e = builderDraft.exos[i];
    if(field==='sets') e.sets = Math.max(1, e.sets+d);
    if(field==='val') e.val = Math.max(e.type==='time'?5:1, e.val+d);
    if(field==='rest') e.rest = Math.max(0, e.rest+d);
    render();
  });
  app.querySelectorAll('[data-remove-exo]').forEach(b=>b.onclick = ()=>{
    const i = parseInt(b.getAttribute('data-remove-exo'));
    builderDraft.exos.splice(i,1); render();
  });

  const actionMap = {
    openAddExo: ()=>{ sheet={type:'addExo'}; render(); },
    openCustomExo: ()=>{ sheet={type:'customExo'}; render(); },
    openEquipment: ()=>{ sheet={type:'equipment'}; render(); },
    openExport: ()=>{ sheet={type:'export'}; render(); },
    openImport: ()=>{ sheet={type:'import'}; render(); },
    copyExport: ()=>{
      const ta = document.getElementById('exportArea');
      if(!ta) return;
      ta.select(); ta.setSelectionRange(0, 999999);
      try{
        navigator.clipboard.writeText(ta.value)
          .then(()=>toast('Copié dans le presse-papiers ✓'))
          .catch(()=>toast('Copie impossible ici : sélectionne le texte et fais Ctrl+C.'));
      }catch(e){ toast('Copie impossible ici : sélectionne le texte et fais Ctrl+C.'); }
    },
    doImport: ()=>{
      const ta = document.getElementById('importArea');
      const raw = ta ? ta.value.trim() : '';
      if(!raw){ toast("Colle d'abord un texte exporté."); return; }
      let data;
      try{ data = JSON.parse(raw); }catch(e){ toast('Texte invalide : vérifie que tu as bien tout copié.'); return; }
      if(!data || typeof data!=='object'){ toast('Format invalide.'); return; }
      if(!confirm('Importer ces données ? Cela remplacera tes séances, exercices, équipement et suivi actuels.')) return;
      if(Array.isArray(data.sessions)){ sessions = data.sessions; saveSessions(sessions); }
      if(Array.isArray(data.customExos)){ customExos = data.customExos; saveCustomExos(customExos); }
      if(data.settings && typeof data.settings==='object'){ settings = Object.assign({sound:true,vibrate:true}, data.settings); saveSettings(settings); }
      if(data.equipment && typeof data.equipment==='object'){ equipment = Object.assign({pullupBar:false,dipBar:false,chair:false,bench:false,bands:false}, data.equipment); saveEquipment(equipment); }
      if(Array.isArray(data.logs)){ logs = data.logs; saveLogs(logs); }
      sheet=null; view='home'; toast('Données importées ✓'); render();
    },
    closeSheet: ()=>{ sheet=null; render(); },
    newSession: ()=>{ builderDraft = newDraft(); view='builder'; render(); },
    cancelBuilder: ()=>{ builderDraft=null; view='home'; render(); },
    saveSession: ()=>{
      if(!builderDraft.name.trim()) builderDraft.name='Séance sans nom';
      if(builderDraft._editIndex!=null){
        sessions[builderDraft._editIndex] = builderDraft;
        delete sessions[builderDraft._editIndex]._editIndex;
      } else {
        sessions.push(builderDraft);
      }
      saveSessions(sessions);
      builderDraft=null; view='home'; toast('Séance enregistrée ✓'); render();
    },
    saveCustomExo: ()=>{
      const name = document.getElementById('customName').value.trim();
      if(!name){ toast('Donne un nom à ton exercice.'); return; }
      const type = document.getElementById('customType').value;
      const cat = document.getElementById('customCat').value;
      const id = 'custom_'+Date.now();
      customExos.push({id, name, cat, type, icon:'⭐', sets:3, val: type==='time'?30:12, rest:45, custom:true});
      saveCustomExos(customExos);
      sheet=null; toast('Exercice créé ✓'); render();
    },
    pause: pausePlayer,
    resume: resumePlayer,
    resetPhase: resetPlayerPhase,
    skip: skipCurrent,
    completeReps: completeRepsSet,
    restMinus: ()=>adjustRest(-15),
    restPlus: ()=>adjustRest(15),
    saveReview: saveReview,
    skipReview: exitPlayer,
    clearLogs: ()=>{
      if(confirm('Effacer tout l\'historique de suivi ?')){ logs=[]; saveLogs(logs); render(); }
    },
    exitPlayer: ()=>{
      if(player.phase==='review' || confirm('Quitter la séance en cours ?')) exitPlayer();
    }
  };
  app.querySelectorAll('[data-action]').forEach(b=>{
    const key = b.getAttribute('data-action');
    if(actionMap[key]) b.onclick = actionMap[key];
  });

  app.querySelectorAll('[data-tips]').forEach(b=>b.onclick = (ev)=>{
    ev.stopPropagation();
    sheet = {type:'tips', exoId:b.getAttribute('data-tips')};
    render();
  });

  app.querySelectorAll('[data-toggle-equip]').forEach(b=>b.onclick = ()=>{
    const key = b.getAttribute('data-toggle-equip');
    equipment[key] = !equipment[key];
    saveEquipment(equipment);
    render();
  });

  app.querySelectorAll('[data-review-done]').forEach(b=>b.onclick = ()=>{
    const i = parseInt(b.getAttribute('data-review-done'));
    player.review[i].completed = b.getAttribute('data-val')==='1';
    render();
  });
  app.querySelectorAll('[data-review-field]').forEach(inp=>inp.oninput = ()=>{
    const i = parseInt(inp.getAttribute('data-i'));
    const field = inp.getAttribute('data-review-field');
    if(field==='sets') player.review[i].actualSets = inp.value;
    else player.review[i].actualVal = inp.value;
  });
  app.querySelectorAll('[data-del-log]').forEach(b=>b.onclick = ()=>{
    const i = parseInt(b.getAttribute('data-del-log'));
    if(confirm('Supprimer cette séance de ton suivi ?')){
      logs.splice(i,1); saveLogs(logs); render();
    }
  });

  app.querySelectorAll('[data-pick-exo]').forEach(b=>b.onclick = ()=>{
    const id = b.getAttribute('data-pick-exo');
    const e = allExoLibrary().find(x=>x.id===id);
    builderDraft.exos.push({libId:e.id, name:e.name, icon:e.icon, type:e.type, sets:e.sets, val:e.val, rest:e.rest});
    sheet=null; render();
  });
  app.querySelectorAll('[data-del-custom]').forEach(b=>b.onclick = (ev)=>{
    ev.stopPropagation();
    const id = b.getAttribute('data-del-custom');
    customExos = customExos.filter(x=>x.id!==id);
    saveCustomExos(customExos); render();
  });

  const overlay = app.querySelector('[data-close-sheet]');
  if(overlay) overlay.onclick = (e)=>{ if(e.target===overlay){ sheet=null; render(); } };
}

render();
})();
</script>
</body>
</html>
